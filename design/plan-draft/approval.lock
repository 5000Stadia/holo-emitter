# The human gate, tied to the document it was given to.
#
# Kabe approved the schematic on 2026-08-21 (blueprint §4b's four rulings). What
# he approved was a picture of ONE plan document, and the sheet is now a derived
# render — so the approval stamp printed on it has to be a fact about that
# document's bytes, not a date typed into the drawing script that survives any
# edit.
#
# WHAT THE STAMP COVERS, narrowed at row 11 on the Navigator's ruling. It used
# to hash the whole plan file. But the stamp asserts "Kabe approved this
# DRAWING", and the sheet draws walls, the exterior outline, openings, windows,
# fireplaces, stairs, standpoints with their distances, and room
# geometry/labels/types — it draws no furniture. `plan.objects` was
# inverse-projected out of staging.json by an agent AFTER the approval, which
# `design/architecture.md` records under "What the approval covers, and what it
# does not". Hashing it made a composition value that blueprint §4's standing
# licence lets an agent move ("change it if it makes the product better, and say
# why") read as "a human must re-approve this drawing", which is not true.
#
# So `plan` below is the sha256 of the DRAWN content only (draw_plan.py's
# DRAWN_KEYS, canonically serialised), and it still fires on ANY change to any
# of it — move one wall and the sheet says UNAPPROVED REVISION. Its value
# changed at row 11 because the INPUT changed, NOT because anything was
# re-approved: the drawn digest of the plan Kabe signed and of the plan today
# are the same string, which is the proof that row 11's one plan edit
# (`stick1`'s footprint) touched nothing he saw.
#
# `undrawn` IS RE-ANCHORED WITH `plan`, and row 20 is where that was learned:
# re-anchoring only the drawn digest leaves the sheet permanently printing
# "content the sheet does not draw has changed since then", which makes the next
# undrawn change invisible — the one thing the second digest exists to prevent.
# An artifact critic found it stuck on.
#
# `undrawn` is the second record, and it is why narrowing the input does not
# delete evidence. It covers everything the sheet does NOT draw. A change there
# does not unapprove the drawing, but it is printed on the sheet's own face
# ("Content the sheet does not draw has changed since then") so it is visible
# rather than silent.
#
# Re-anchoring after a redline is a HUMAN step, and deliberately not automated:
# put the new sha256s and the new date here only once Kabe has approved the new
# sheet. design/plan-draft/README.md's redline recipe says where in the order it
# goes.
#
# Format: one "plan  <sha256>  <YYYY-MM-DD>" line and one "undrawn  <sha256>"
# line. Everything else is comment.
#
# THE `pending` LINE IS DERIVED, NOT WRITTEN. It is computed from
# standpoints.tsv against the last sheet a human looked at directly, and
# plan.spec requires this file to carry exactly the computed string - which
# drawn family moved, and on how many facings. It used to be a sentence
# somebody composed, and a critic replaced it with a sentence naming the right
# subject and then denying it ("... are exactly as he approved them; nothing on
# this sheet needs his eye"), printed on both sheets with every check green. A
# claim that a human authors is a claim a human can negate, so no human authors
# this one: when it is wrong the test prints the line to paste.
#
# RE-ANCHORED AT ROW 20, and what that anchor rests on, in full.
#
# What changed in the drawing: every facing whose viewed wall does not fit the
# frame from its drawn standpoint now stands at the far side of its room
# instead - 0.45 m off the wall behind it, pulled forward where a hearth or a
# stair flight is in the way, and their printed distances moved with them.
#
# HOW MANY IS NOT STATED HERE, AND THAT IS THE FIX. This paragraph used to
# count the moved standpoints in its own words - a number typed into a comment
# and read by nothing, which turned out to be no baseline's answer at all. The
# first repair replaced it with the right number and
# pattern-matched for that one spelling, and a critic typed the false sentence
# straight back in, in words instead of digits, with the suite green. A guard
# that enumerates one phrasing cannot hold prose. So the count lives exactly
# once, in the `pending` line at the foot of this file, which is computed from
# standpoints.tsv rather than written - and when prose states no number there
# is no number for prose to get wrong. [Ruled by the Navigator at the row-20
# close, 2026-08-22, on the critic's own first constraint.]
#
# Nothing else the sheets draw changed: no wall, no opening, no window, no
# hearth, no stair, no room.
#
# The authority: Kabe's approval of the perspective preview frames on
# 2026-08-21 - "If so full steam ahead, lets build this thing" - which blessed
# `01d` (the study's north view from the THRESHOLD, 4.35 m) and `02b` (the
# passage's east view from its DRAWN standpoint, 6.00 m). Those two frames are
# the standpoint law stated in pictures, and the law was applied mechanically
# to the rest of the manor from them.
#
# What that authority does NOT cover, and the stamp says so on the sheet's own
# face rather than in this comment: Kabe has seen two RENDERED FRAMES, not
# these two redrawn schematics. The `pending` line below is printed in the
# stamp - "APPROVED ... AWAITING HIS EYE ON: ..." - so a reader of the sheet
# learns from the sheet that the standpoint markers are new. The sheets are in
# `design/batches/row20-lens/` with the row's other questions.
#
# Row 20 closed at its lens boundary on 2026-08-22 WITHOUT his word on that
# batch, and the batch therefore stays in the tree: it rides with the row that
# re-batches over the painted world. The `pending` line stands until he has
# looked, and the test that requires it keys on the batch directory's
# existence rather than on any row number, so nothing about the close relaxes
# it.
#
# ROW 26 IS A REDLINE AND THESE TWO DIGESTS DID NOT MOVE FOR IT.
#
# Row 26 gave the standpoint law a second question — not only how far back a
# facing stands, but where along its own wall — because the cross passage's
# doors sit near one end of it and from the middle the buttery's doorway showed
# 54 px of its 476, which is what the Captain walked into. Two of the manor's
# 88 standpoints slid: `hall/N` and `hall/S`. The markers on both sheets moved
# with them, so the drawn digest below no longer describes this drawing and the
# sheets print UNAPPROVED REVISION, which is exactly what a redline is supposed
# to do. Re-anchoring is Kabe's glance and the two manual steps in
# `design/plan-draft/README.md`, and this row does not take them: it hands the
# re-rendered sheets to him with `AWAITING KABE` in `design/approvals.log`.
#
# The `pending` line below is re-derived rather than rewritten — the standpoint
# table gained a `standpoint_offset_m` column so the clause could learn the new
# family, and `plan.spec` computed the string it now carries.
#
# IT COUNTS PER FAMILY NOW, and that is a correction rather than a flourish. The
# first version of the line read "the standpoint distances and the standpoints'
# own lateral slides on 38 of the manor's 88 facings" — the union, true of
# neither half: 38 distances moved at row 20 and TWO standpoints slid at row 26.
# This line is the whole of what tells Kabe what to look for on a sheet, and a
# count that overstates the smaller family nineteenfold sends him hunting for
# markers that did not move.
# RE-ANCHORED 2026-08-24 UNDER THE CAPTAIN'S STANDING DIRECTIVE, and what that
# word is, in full. Kabe, 2026-08-24, verbatim: "Instead of waiting on me
# change the status to keep building and pushing until complete." — recorded in
# `design/approvals.log` the same day. That is a human's word converting his
# gates to non-blocking review: the re-anchor cites it, the row-26 batch
# (`design/batches/row26-gate/`, before/after frames and both re-rendered
# sheets) sits in his review queue, and his glance can still revert the slide —
# the standing word authorises proceeding, it does not delete his eye. The
# drawn change this anchor covers beyond row 20's: two standpoints slid along
# their own wall (the pending line below carries the count per family, derived
# as ever, never composed).
