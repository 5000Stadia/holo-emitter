# The human gate, tied to the document it was given to.
#
# Kabe approved the schematic on 2026-08-21 (blueprint §4b's four rulings). What
# he approved was a picture of ONE plan document, and the sheet is now a derived
# render — so the approval stamp printed on it has to be a fact about that
# document's bytes, not a date typed into the drawing script that survives any
# edit.
#
# WHAT THE STAMP COVERS, narrowed at row 11 on the Navigator's ruling. It used
# to hash the whole plan file. But the stamp asserts "Kabe approved this
# DRAWING", and the sheet draws walls, the exterior outline, openings, windows,
# fireplaces, stairs, standpoints with their distances, and room
# geometry/labels/types — it draws no furniture. `plan.objects` was
# inverse-projected out of staging.json by an agent AFTER the approval, which
# `design/architecture.md` records under "What the approval covers, and what it
# does not". Hashing it made a composition value that blueprint §4's standing
# licence lets an agent move ("change it if it makes the product better, and say
# why") read as "a human must re-approve this drawing", which is not true.
#
# So `plan` below is the sha256 of the DRAWN content only (draw_plan.py's
# DRAWN_KEYS, canonically serialised), and it still fires on ANY change to any
# of it — move one wall and the sheet says UNAPPROVED REVISION. Its value
# changed at row 11 because the INPUT changed, NOT because anything was
# re-approved: the drawn digest of the plan Kabe signed and of the plan today
# are the same string, which is the proof that row 11's one plan edit
# (`stick1`'s footprint) touched nothing he saw.
#
# `undrawn` is the second record, and it is why narrowing the input does not
# delete evidence. It covers everything the sheet does NOT draw. A change there
# does not unapprove the drawing, but it is printed on the sheet's own face
# ("Content the sheet does not draw has changed since then") so it is visible
# rather than silent.
#
# Re-anchoring after a redline is a HUMAN step, and deliberately not automated:
# put the new sha256s and the new date here only once Kabe has approved the new
# sheet. design/plan-draft/README.md's redline recipe says where in the order it
# goes.
#
# Format: one "plan  <sha256>  <YYYY-MM-DD>" line and one "undrawn  <sha256>"
# line. Everything else is comment.
plan  3ab033f97955d1c970c7b07a09634ea96243cdb264a6321c6fbfba946d136c9c  2026-08-21
undrawn  76cd7120ccb91fc9eed35fdf3765cb406bbefb9a158ad177d4f232af5473edfd
