      if (a.polys && a.polys.length) {
        for (var pi = 0; pi < a.polys.length; pi++) {
          var ring = a.polys[pi];
          if (!ring || ring.length < 3) continue;
          overlayCtx.beginPath();
          for (var i = 0; i < ring.length; i++) {
            if (i === 0) overlayCtx.moveTo(ring[i][0], ring[i][1]);
            else overlayCtx.lineTo(ring[i][0], ring[i][1]);
          }
          overlayCtx.closePath();
          overlayCtx.stroke();
        }
      } else {
        overlayCtx.strokeRect(
          a.x + OUTLINE_PX / 2, a.y + OUTLINE_PX / 2,
          a.w - OUTLINE_PX, a.h - OUTLINE_PX);
      }
      overlayCtx.restore();
    }

    /* The scratch canvases are sized to the hovered entity's own rectangle,
       not to the frame. At full size this ran ~93 ms per mousemove on an
       unthrottled desktop — sixteen 1536×1024 blits and two full-frame
       composite passes for every pointer sample — which dropped the page to
       ~10 fps while the cursor was over anything. It is chrome, outside the
       scene hash, so bounding it costs nothing that is guaranteed. */
    function outline(entry) {
      var r = entryRect(entry);
      var pad = OUTLINE_PX + 2;
      var ox = Math.floor(r.x) - pad;
      var oy = Math.floor(r.y) - pad;
      var ow = Math.ceil(r.w) + pad * 2;
      var oh = Math.ceil(r.h) + pad * 2;
      if (ow <= 0 || oh <= 0) return;
      if (!haloA) {
        haloA = document.createElement("canvas");
        haloB = document.createElement("canvas");
      }
      if (haloA.width < ow || haloA.height < oh) {
        haloA.width = haloB.width = ow;
        haloA.height = haloB.height = oh;
      }
      var ac = haloA.getContext("2d");
      var bc = haloB.getContext("2d");
      ac.clearRect(0, 0, haloA.width, haloA.height);
      bc.clearRect(0, 0, haloB.width, haloB.height);
      ac.save();
      ac.translate(-ox, -oy);
      window.HOLO.renderer.stamp(ac, entry, {});
      ac.restore();
      for (var a = 0; a < 8; a++) {
        var ang = a * Math.PI / 4;
        bc.drawImage(haloA, OUTLINE_PX * Math.cos(ang), OUTLINE_PX * Math.sin(ang));
      }
      bc.globalCompositeOperation = "source-in";
      bc.fillStyle = HILITE;
      bc.fillRect(0, 0, haloB.width, haloB.height);
      bc.globalCompositeOperation = "destination-out";
      bc.drawImage(haloA, 0, 0);
      bc.globalCompositeOperation = "source-over";
      overlayCtx.save();
      if (entry.clip) {
        overlayCtx.beginPath();
        overlayCtx.rect(entry.clip.x, entry.clip.y, entry.clip.w, entry.clip.h);
        overlayCtx.clip();
      }
      overlayCtx.drawImage(haloB, 0, 0, ow, oh, ox, oy, ow, oh);
      overlayCtx.restore();
    }

    /* Hover AND keyboard focus, one overlay (row 10). Originally two
       independent clear-and-redraw paths — showHover(p)/clearHover() — that
       would have raced against each other the moment a second, focus-driven
       source of the same outline existed: a mouse hover clearing the canvas
       would have erased a keyboard user's focus ring, and the reverse. Both
       now draw through this one function, which clears once and then draws
       whichever of the two (or both, if they coincide) currently apply — a
       sighted keyboard user tabbing while the mouse still rests somewhere
       sees both outlines, not one silently overwriting the other. */
    function drawResolved(r) {
      if (!r || r.kind === "none") return;
      if (r.kind === "doorway") {
        /* The way between rooms answers the cursor like everything else.
           Without this the one thing that moves you had no highlight and no
           pointer, while every object in the room had both. */
        outlineRect(r.aperture);
        return;
      }
      var entry = entryOf(r.id);
      if (entry) outline(entry);
    }

    function paintOverlay() {
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      if (!currentLayout) { scene.style.cursor = ""; return; }
      var hoverR = lastPointer ? resolve(lastPointer) : null;
      if (focusTarget) drawResolved(focusTarget);
      if (hoverR) drawResolved(hoverR);
      scene.style.cursor = (hoverR && hoverR.kind !== "none") ? "pointer" : "";
    }

    /* Touch never sends `mouseleave`, and a refused tap does not repaint, so
       without help every refused tap leaves a glowing halo around the thing it
       refused until the next tap somewhere else. Clearing on `pointerup` is
       not enough: the real event order on a touch device is
       pointerdown → pointerup → mousemove → mousedown → mouseup → click, so
       the compatibility `mousemove` arrives AFTER the clear and re-inks it.
       (A hand-built sequence in the other order made a test green over this
       for a while — synthetic events can always be arranged into the order
       the code happens to handle.) So a non-mouse pointer sets a flag, and
       the next mousemove spends it instead of drawing. */
    var swallowNextMove = false;

    scene.addEventListener("mousemove", function (e) {
      if (swallowNextMove) { swallowNextMove = false; lastPointer = null; paintOverlay(); return; }
      try {
        lastPointer = canvasPoint(e);
        paintOverlay();
      } catch (err) {
        fault(err);
      }
    });
    /* The pane's promise is about what a reader can SEE, and the box changes
       size after load: rotate a phone, or bump the browser's text size, and
       the scroll position computed for the old box leaves the newest line
       out of view until the next message arrives. Rotating a phone is the
       most ordinary thing a stranger does. */
    window.addEventListener("resize", scrollNarration);
    window.addEventListener("orientationchange", scrollNarration);

    scene.addEventListener("mouseleave", function () { lastPointer = null; paintOverlay(); });
    scene.addEventListener("pointerdown", function (e) {
      if (e.pointerType && e.pointerType !== "mouse") swallowNextMove = true;
    });
    scene.addEventListener("pointerup", function (e) {
      if (e.pointerType && e.pointerType !== "mouse") {
        swallowNextMove = true; lastPointer = null; paintOverlay();
      }
    });

    /* [Row 15] A CHEVRON YIELDS TO A WAY THROUGH UNDERNEATH IT.
     *
     * The chevrons are chrome laid over the picture — 6 % opaque, so the room
     * shows THROUGH them — and they sit at the frame's edges at eye height,
     * which is exactly where a doorway on a side wall is drawn. At the manor's
     * scale that stopped being theoretical: a real click at the exact middle of
     * the only visible part of the cross passage's north doorway TURNED THE
     * VIEWER EAST instead of walking them through it, at both viewports, and on
     * a phone the right chevron covered a quarter of the great hall's garden
     * door. Four ways through the building were behind a button that meant
     * something else.
     *
     * A person clicking a doorway they can plainly see is asking to walk
     * through it, whatever is layered over the pixels. So the chevron asks the
     * picture first: a point inside a way through dispatches that way, and only
     * a point that is over no way at all turns the room. The test is the
     * APERTURE POLYGON — a definite walkable target — and not `resolve()`
     * generally, because a chevron should not become a way of picking up a
     * teacup. Where nothing is behind it, which is the ordinary case on 84 of
     * the 88 facings, it turns exactly as before. */
    /* [Row 25] AND IT NEVER GIVES UP ITS WHOLE SELF.
     *
     * The yield above is right about a doorway and wrong about a MOUTH. The
     * entrance court's south side is a 20.4 m opening whose rectangle is
     * 3095 px wide on a 1536 px frame: every pixel of both chevrons is inside a
     * way through, so both of them walked the player out of the court over
     * their whole area and neither turned — a room a pointer could not look
     * around in. The yield's own justification is that the chrome is IN THE WAY
     * of a target ("a person clicking a doorway they can plainly see"), and
     * nothing is in the way of a mouth that fills the frame.
     *
     * So the test is the button, not the target: if some part of the chevron is
     * over no way through at all, the part that IS over one yields and the rest
     * still turns — which is every case round four found, the great hall's
     * garden door at 26 % of a phone chevron included. If the ways through
     * cover the button entirely, the chevron keeps its own meaning, because the
     * alternative is a facing with no pointer turn on it.
     *
     * Sampled rather than solved: a way through may be a rectangle or a
     * flight's own rings, and a coverage test that only knew rectangles would
     * be a second answer to "what is inside a way through". */
    function chevronFullyCovered(el) {
      var box = el.getBoundingClientRect();
      var r = scene.getBoundingClientRect();
      if (!(r.width > 0 && r.height > 0)) return false;
      var list;
      try { list = apertureList(); } catch (err) { return false; }
      if (!list.length) return false;
      for (var iy = 0; iy <= 6; iy++) {
        for (var ix = 0; ix <= 6; ix++) {
          var cx = box.left + (box.width * ix) / 6;
          var cy = box.top + (box.height * iy) / 6;
          var p = { x: ((cx - r.left) * scene.width) / r.width,
            y: ((cy - r.top) * scene.height) / r.height };
          var covered = false;
          for (var i = 0; i < list.length; i++) {
            if (list[i].exit && apertureHolds(list[i], p.x, p.y, 0)) { covered = true; break; }
          }
          if (!covered) return false;
        }
      }
      return true;
    }

    /* AND THE QUESTION IS ASKED OF THE FACING, NOT OF ONE BUTTON. A chevron
       wholly inside a way through has no turn left in it — but the room still
       has one as long as the OTHER chevron is free, and a player who can turn
       left can reach every facing. So a covered chevron still yields while its
       partner can turn, and only when BOTH are covered do they both keep their
       own meaning, because that is the one case where yielding leaves a facing
       with no pointer turn at all.
       Six chevrons in this manor are wholly covered: both of the entrance
       court's (a 3095 px mouth over a 1536 px frame — the facing the row was
       allocated for) and four sitting on flights. Under the per-button rule
       those four turned, and turning on a drawn staircase is this row's own
       defect in miniature: 2–3 % of a flight's body lies under a chevron. Under
       this one they climb, and the court still turns. */
    function turnOrGoThrough(dir, e) {
      var ap = null;
      try { ap = apertureAt(canvasPoint(e)); } catch (err) { ap = null; }
      if (ap && ap.exit) {
        var bothCovered = chevronFullyCovered(document.getElementById("chevron-left")) &&
          chevronFullyCovered(document.getElementById("chevron-right"));
        if (!bothCovered) { walkThrough(ap); return; }
      }
      dispatch({ type: "turn", dir: dir });
    }
    document.getElementById("chevron-left").addEventListener("click", function (e) {
      turnOrGoThrough("left", e);
    });
    document.getElementById("chevron-right").addEventListener("click", function (e) {
      turnOrGoThrough("right", e);
    });

    /* Row 8: fullscreen. One state (real OS fullscreen OR the in-page
       maximize fallback) drives html.fs-active and the button's label
       together, so the two mechanisms can never disagree (an earlier draft
       let them). Real API preferred; a rejection falls through to the same
       fallback flag a missing API uses. */
    var manualMaximize = false;
    function requestFS() {
      var el = document.documentElement;
      if (el.requestFullscreen) return el.requestFullscreen();
      if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
      return null;
    }
    function exitFS() {
      if (document.exitFullscreen) return document.exitFullscreen();
      if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
      return null;
    }
    function isFullscreenActive() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || manualMaximize);
    }
    function syncFullscreenUI() {
      var active = isFullscreenActive();
      document.documentElement.classList.toggle("fs-active", active);
      /* The visible icon has to move with the same one state the label
         reads from, or the picture and the string contradict each other —
         an artifact critic caught the icon frozen on "expand" while the
         label already said "leave the full screen". */
      fullscreenBtn.classList.toggle("active", active);
      fullscreenBtn.setAttribute("aria-label", active ? "leave the full screen" : "fill the screen");
    }
    fullscreenBtn.addEventListener("click", function () {
      var real = document.fullscreenElement || document.webkitFullscreenElement;
      if (real) {
        manualMaximize = false;
        var p = exitFS();
        /* BELT AND BRACES, and the record says so rather than claiming a fix.
           A critic caught the button still reading "leave the full screen"
           after `document.fullscreenElement` was already null, and this
           promise sync was added alongside a test change. A later critic then
           showed the honest thing: delete these two lines and the suite still
           passes, because `fullscreenchange` was already wired and the test's
           condition-wait resolves exactly when the queued listener would have
           healed it. What removed the flake was the TEST becoming a condition
           instead of a timer. This stays because it is a real second chance on
           a path where the label is what a screen-reader user is told — but it
           is not load-bearing, and no check here can prove it is. */
        if (p && p.then) p.then(syncFullscreenUI, function () { manualMaximize = false; syncFullscreenUI(); });
        else syncFullscreenUI();
        return;
      }
      if (manualMaximize) {
        manualMaximize = false;
        syncFullscreenUI();
        return;
      }
      var req = requestFS();
      if (req && req.then) {
        req.then(syncFullscreenUI, function () { manualMaximize = true; syncFullscreenUI(); });
      } else if (!req) {
        manualMaximize = true;
      }
      syncFullscreenUI();
    });
    document.addEventListener("fullscreenchange", syncFullscreenUI);
    document.addEventListener("webkitfullscreenchange", syncFullscreenUI);
    syncFullscreenUI();
    window.addEventListener("keydown", function (e) {
      if (e.altKey || e.ctrlKey || e.metaKey) return; // browser gestures stay the browser's
      /* The transcript is a focusable scrollable region, so while it holds
         focus the arrows are its own — otherwise two keyboard affordances
         claim the same key and the room turns while a reader is trying to
         move through the prose. */
      if (document.activeElement === narrationEl) return;
      /* [Row 15] AND THE KEY IS CONSUMED. An arrow that turns the room is the
         room's; leaving the default in place meant the same press ALSO scrolled
         the document, which is invisible until something makes the page wider
         than the window — and row 15's off-frame control did exactly that. Two
         effects from one press is one too many whatever the page's width. */
      if (e.key === "ArrowLeft") { dispatch({ type: "turn", dir: "left" }); e.preventDefault(); }
      else if (e.key === "ArrowRight") { dispatch({ type: "turn", dir: "right" }); e.preventDefault(); }
    });

    /* The developer witness, at boot, always — on the console, which is
       where speech about this project's construction belongs. It used to be
       a line of chrome under the picture: a fingerprint, a repository path
       and a shell command, read by every stranger who opened the public
       link and addressed to none of them.
       console.info, not warn/error: the console is now the load-bearing
       developer channel, and a channel that is already noisy is one nobody
       reads — a shell.spec guard holds a healthy run to no warnings and no
       errors. The explicit MISSING marker exists because a witness whose
       failure mode is the token "undefined" can be dead with nobody
       alerted. */
    console.info(
      "holo-emitter — fixture bake fp " +
        (fixture.fp || "MISSING (the bake wrote none)") + "\n" +
      /* [Row 15] THE WORLD IT ACTUALLY BOOTED, and the command that re-bakes
         THAT one. These two lines named `demo-study` whatever was on screen,
         so a person editing the world the bare link serves and following the
         page's own instruction re-baked the other fixture and left this one
         stale in silence — the console being the load-bearing developer
         channel, that is the one place it may not be wrong. */
      "truth: fixtures/" + fixture.id + "/*.json (world, staging, narration, viewstate)\n" +
      "after editing a fixture, re-bake: node tools/bake-fixtures.mjs" +
        (fixture.id === "demo-study" ? "" : " --fixture-dir fixtures/" + fixture.id));

    var boot = harness.viewstate;
    var bootLoc = fixture.world.locations.filter(function (l) {
      return l.id === boot.location;
    })[0];
    var bootFault = (!bootLoc || bootLoc.facings.indexOf(boot.facing) === -1);
    if (bootFault) {
      /* A genuine fault, so it stays visible — but player-voiced, with the
         mechanics on the console. The bake refuses an invalid boot viewstate
         and the bootstrap re-checks, so this arises only from a hand-edited
         or corrupted fixture.js; the page still paints (grid mode resolves
         an unknown location) and every turn is refused, so the player is
         told here and again by the turn refusal.
         "view", not "place": the viewstate can name a location the world
         lacks OR a facing that location lacks, and on the second branch the
         place exists and only the aim within it is wrong. */
      console.error(
        "BOOT ERROR: viewstate " + JSON.stringify(boot) +
        " names no location/facing in world.json — every turn will be refused. " +
        /* THE WORLD THAT ACTUALLY BOOTED, not the one this page shipped with.
           The line fourteen lines above learned this; this one had not, and
           told a reader of the manor's console to go and edit the study. */
        "Fix fixtures/" + fixture.id + "/viewstate.json and run: " +
        "node tools/bake-fixtures.mjs" +
          (fixture.id === "demo-study" ? "" : " --fixture-dir fixtures/" + fixture.id));
    }
    window.HOLO_APP = {
      harness: harness, paints: 0, library: library, dispatch: dispatch,
      /* `resolve` is where a click's meaning is decided — entity, doorway or
         nothing — and it is what a pointer-driven test should ask.
         `hitAtPoint` is only its entity half and returns null inside an open
         doorway; `apertureAt` is only the doorway half. Both are exposed
         because helpers use the difference between them to find a point that
         means travel, but a test that reaches for `hitAtPoint` expecting the
         page's routing will assert the wrong thing. */
      hitAtPoint: hitAtPoint, apertureAt: apertureAt, resolve: resolve,
      /* [Row 15] The whole aperture list, so a test can ask where every way
         through this facing is drawn and put a real click in the middle of
         it. Without this a pointer test has to guess at coordinates, which is
         how four ways through ended up behind a button nothing noticed. */
      apertureList: apertureList,
      /* The page's own meta resolution, exposed because a test that reaches
         for GRID_META on a facing the plan holds is asking about geometry the
         picture is not drawn with. Since row 11 that is every shipped
         facing. */
      backdrops: backdrops, metaFor: metaFor
    };
    function bootPaint() {
      harness.subscribe(paint);
      harness.redraw();
      updateChrome(null);
      /* After the first paint, so a page that faulted on the way up shows its
         own fault line last rather than this one. `halted` is set by fault(). */
      if (bootFault && !halted) {
        appendNarration("The projection was set to a view this pattern does not hold.");
      }
    }
    if (pendingImages.length === 0) {
      bootPaint();
    } else {
      /* The first frame waits for the paintings, and only for them. A painting
         that will not decode is a corrupt bake, and what the page does then is
         drop it and draw the grid: the room reads as unestablished, which is
         the one honest thing a picture can say when it cannot show what the
         document holds, and the developer detail goes to the console. The
         accepted deviation is that a visitor cannot tell that from an
         intentionally unpainted wall — the same shape as the stale-bake
         deviation, and the same mitigation: the suite, before a push. */
      var left = pendingImages.length;
      var settle = function (ev) {
        if (ev && ev.type === "error") {
          var key = ev.target && ev.target.dataset ? ev.target.dataset.facing : "?";
          console.error("BACKDROP ERROR: the baked painting for " + key +
            " did not decode — that facing falls back to the grid. Re-run: node tools/bake-backdrops.mjs");
          if (backdrops[key]) delete backdrops[key].image;
        }
        if (--left === 0) bootPaint();
      };
      for (var pi = 0; pi < pendingImages.length; pi++) {
        pendingImages[pi].addEventListener("load", settle);
        pendingImages[pi].addEventListener("error", settle);
      }
    }
  })();
  </script>
</body>
</html>
