<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>holo-emitter</title>
<style>
  html, body { margin: 0; padding: 0; background: #05070a; color: #c8b489; }
  /* Centred vertically: the stage is a fixed 3:2 and the chrome is a fixed
     9.6rem, so on any screen taller than the two of them the remainder is
     dead space — and top-aligned it all pooled below, 38% of a phone screen
     under a small picture and a line of prose. Nothing is cropped and no
     hash moves; this is where the letterbox goes. */
  body {
    font-family: Georgia, serif;
    min-height: 100svh; display: flex; flex-direction: column; justify-content: center;
  }
  /* The stage contain-fits the fixed 1536x1024 logical canvas within the
     window (§5 viewport, amended at row 1): width-only scaling pushed the
     frame-bottom floor cut — the camera-has-feet device — below the fold on
     16:9 screens. 8.8rem is reserved for the bottom chrome, which is what
     the bottom chrome measures: narration 4.2 + inventory 3.4 + status 1.2.
     It read 9.6rem for a while against a chrome of 8.8, so the picture was
     ~9 px shorter and ~13 px narrower than the layout's own budget allowed
     at every height-bound viewport, and nothing compared the reserve to what
     it reserves for. The canvases keep their internal size. */
  #stage {
    position: relative;
    /* The max() is a floor for the degenerate case only: below ~154px of
       viewport height the contain-fit calc goes to zero and the page
       rendered literally nothing. It has to sit low enough not to bind on a
       real device — at 320px it kicked in for any viewport under 367px tall,
       which is every phone in landscape, and added 20px of scroll where the
       plain calc fitted exactly. 120px binds below ~234px. */
    /* svh, not vh: on iOS Safari `100vh` is the viewport WITHOUT the
       toolbars, so a layout that exactly fills it puts the status line and
       part of the inventory under the toolbar — and in phone landscape this
       one has 9 px of slack. Safari is the one engine this build has never
       been run on, so it gets the unit that cannot be wrong rather than a
       measurement nobody here can take. */
    width: min(100%, max(120px, calc((100svh - 8.8rem) * (1536 / 1024))));
    margin: 0 auto;
    aspect-ratio: 1536 / 1024;
  }
  #scene, #overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: block;
  }
  #overlay { pointer-events: none; } /* hover overlay: chrome, never hashed */
  /* The go fade: DOM chrome over the canvas, never canvas drawing (§8).
     Order matters and was wrong once: the veil covers the room you are
     LEAVING before the viewstate moves, then fades off the room you have
     arrived in. So `.instant` (no transition) snaps it black at the moment
     of the click, and removing `.on` fades the arrival up over 0.38s. A
     veil that fades in after the destination is already painted blacks out
     the room you just walked into.
     pointer-events: none — input stays live through the fade (accepted V1
     consequence, recorded in the design documents). */
  #veil {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; opacity: 0; transition: opacity 0.38s ease;
    pointer-events: none;
  }
  #veil.on { opacity: 1; }
  #veil.instant { transition: none; }
  .chevron {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 4%; min-width: 40px; height: 20%;
    background: rgba(200, 180, 137, 0.06); color: #c8b489;
    border: 1px solid rgba(200, 180, 137, 0.35);
    font-size: 2rem; cursor: pointer; z-index: 2;
  }
  #chevron-left { left: 0; border-left: none; }
  #chevron-right { right: 0; border-right: none; }
  /* Bottom chrome: narration log + inventory strip + status = 9.6rem.
     Bare surfaces — no labels, no empty-state text (the product's voice
     rule: method speech goes nowhere). */
  /* 4.2rem, not 3.2: at 390 px an arrival line wraps to two rows and the
     pane held one and a sliced half of another, permanently, with ascenders
     cut mid-glyph. The narration is the only thing in this product that
     speaks to a player. The 9.6rem chrome budget is unchanged — the room
     comes out of the inventory strip and the status line. */
  #narration {
    /* border-box, so the 2px of padding lives inside the 4.2rem rather than
       adding to it: the stage's reserve is stated in rem and the chrome has
       to measure what it says. */
    box-sizing: border-box;
    height: 4.2rem; overflow-y: auto; padding: 2px 8px;
    font-size: 0.95rem; line-height: 1.3;
  }
  #narration p { margin: 0 0 2px 0; }
  /* Slack under the last message, on the CONTENT so the box does not grow
     and the 9.6rem chrome budget is untouched. The pane can only scroll as
     far as its content, so with no slack the only reachable position is the
     exact bottom — which lands the top edge mid-line whatever the heights
     are. This buys the few pixels the snap needs; it shows as blank only
     when a line boundary demands it. */
  #narration p:last-child { margin-bottom: 2.6rem; }

  #inventory {
    height: 3.4rem; padding: 0 8px; display: flex; gap: 6px;
    align-items: center;
  }
  #inventory canvas.inv-tile {
    /* One sampling policy for all three. The thumbs are built nearest-
       neighbour from sources of very different size (key 80×48, coin 24×24),
       and letting the browser smooth the CSS downscale on top of that left
       the coin a soft grey blob beside two crisp tiles — a visible tell that
       one object was made differently, which is exactly what "one hand" is
       about. */
    image-rendering: pixelated;
    width: 48px; height: 48px;
    border: 1px solid rgba(200, 180, 137, 0.35);
    background: rgba(200, 180, 137, 0.04);
  }
  /* One row, ellipsised. A fixed-height box with wrapping text presents a
     second row sliced through its ascenders — half a line of type, which is
     the defect the narration pane above is careful about. Row 7 replaces the
     wording; the box has to hold whatever replaces it. */
  #status {
    height: 1.2rem; line-height: 1.2rem; font-size: 0.75rem; opacity: 0.6;
    padding: 0 8px; box-sizing: border-box;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  /* Capture mode: §12.6 flip pairs are element screenshots of the scene
     canvas, and overlapping DOM appears in element screenshots — so all
     chrome hides under this class; capture tooling sets it. */
  body.capture .chrome { display: none; }
  /* Capture mode also drops the vertical centring: §12.6 wants the scene
     element captured at exactly 1536×1024, and a flex-centred stage lands on
     a fractional y, which rounds the element screenshot to 1025 px tall. All
     chrome is hidden here anyway, so block layout puts the stage at 0. */
  body.capture { display: block; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="scene" width="1536" height="1024"></canvas>
    <canvas id="overlay" width="1536" height="1024"></canvas>
    <div id="veil" class="chrome"></div>
    <button id="chevron-left" class="chevron chrome" aria-label="turn left">&lsaquo;</button>
    <button id="chevron-right" class="chevron chrome" aria-label="turn right">&rsaquo;</button>
  </div>
  <div id="narration" class="chrome" tabindex="0" aria-live="polite" aria-label="what the room says"><noscript><style>.chevron{display:none}</style><p>This place is projected by your browser, and your browser is not running scripts. Nothing can be shown here until it does.</p></noscript></div>
  <div id="inventory" class="chrome" role="group" aria-label="what you are carrying"></div>
  <div id="status" class="chrome"></div>
  <script>
  /* Registered before anything else loads, and depending on nothing that
     could fail: if a script does not arrive or throws on the way up, the
     page used to sit black and silent with `‹ ›` as its entire text — the
     exact shape of a partial load over a public link. The product says so
     itself instead, in its own voice, and the developer detail goes to the
     console. */
  (function () {
    "use strict";
    var said = false;
    function wavers() {
      if (said) return;
      /* Only for a page that never got a frame up. This sentence says
         "nothing of this place can be shown", and an uncaught error thrown
         at any later moment — a stray timer, an extension, anything — used
         to print it over a scene that was painted and working, with every
         affordance still live. A reachable surface string that is false in a
         reachable state is what "the picture never lies about it" rules out;
         a fault after the first frame belongs to the render path's own
         handler, which knows what it is talking about. */
      if (window.HOLO_APP && window.HOLO_APP.paints > 0) return;
      said = true;
      var pane = document.getElementById("narration");
      if (!pane) return;
      var p = document.createElement("p");
      p.textContent = "The projection will not hold. Nothing of this place can be shown.";
      pane.appendChild(p);
    }
    window.addEventListener("error", function (e) {
      console.error("boot fault:", e && (e.error || e.message));
      wavers();
    }, true);
    window.addEventListener("DOMContentLoaded", function () {
      // Every script ran, but the app never took: same silence, same answer.
      if (!window.HOLO_APP) setTimeout(function () {
        if (!window.HOLO_APP) wavers();
      }, 0);
    });
  })();
  </script>
  <script src="fixtures/demo-study/fixture.js"></script>
  <script src="src/groundplane.js"></script>
  <script src="src/placeholders.js"></script>
  <script src="src/renderer.js"></script>
  <script src="src/harness.js"></script>
  <script src="src/inventory.js"></script>
  <script>
  /* Bootstrap: wiring only. The harness owns viewstate; every view change
     flows intent -> envelope -> redraw, and the boot paint is the harness
     invoking its own subscriber once. The harness keeps ONE subscriber (the
     scene painter, invoked only on non-empty events) and HOLO_APP.paints
     counts exactly those invocations; narration and inventory are not
     subscribers — every input handler passes the returned envelope to one
     synchronous updateChrome. */
  (function () {
    "use strict";
    var fixture = window.HOLO_FIXTURE;
    var harness = window.HOLO.harness.create(fixture);
    var scene = document.getElementById("scene");
    var overlay = document.getElementById("overlay");
    var overlayCtx = overlay.getContext("2d");
    var narrationEl = document.getElementById("narration");
    var inventoryEl = document.getElementById("inventory");
    var veil = document.getElementById("veil");
    var library = window.HOLO.placeholders.build(document);
    var backdrops = {}; // row 4 fills this; the resolution rule is the renderer's
    function metaFor(vs) {
      var e = backdrops[vs.location + "/" + vs.facing];
      return (e && e.meta) ? e.meta : window.HOLO.renderer.GRID_META;
    }
    var paints = 0;
    var currentLayout = null;
    var veilTimer = null;
    var lastGo = null;          // { exit, at } — the double-click echo guard
    var DOUBLE_CLICK_MS = 400;
    var lastPointer = null;
    var halted = false;         // a fault the page cannot come back from

    /* Render-path faults surface in the product's voice (the intention's
       standing rule: every reachable surface string, errors included, is
       product speech; developer detail goes to the console). */
    /* Said once, and then the page stops offering things that will not work.
       Repeating the same apology per arrow key, with the chevrons still lit,
       leaves a player pressing buttons at a black rectangle that stutters. */
    function fault(err) {
      console.error("render fault:", err);
      if (halted) return;
      halted = true;
      appendNarration("The projection wavers; the pattern will not resolve.");
      var chevrons = document.querySelectorAll(".chevron");
      for (var i = 0; i < chevrons.length; i++) chevrons[i].style.display = "none";
      scene.style.cursor = "";
    }

    function paint(viewstate) {
      try {
        window.HOLO.renderer.render(
          scene, harness.world, harness.staging, library, backdrops, viewstate, {});
        currentLayout = window.HOLO.renderer.layout(
          harness.world, harness.staging, library, metaFor(viewstate), viewstate);
      } catch (err) {
        /* A fault used to return here with the previous frame's pixels still
           on the canvas, the previous hover outline still inked, and the
           pointer cursor still promising something clickable — the world had
           moved and the picture had not, which is the same lie as the
           picture moving when the world has not. Clear all three, so the
           fault line is the only thing the page is claiming. */
        currentLayout = null;
        scene.getContext("2d").clearRect(0, 0, scene.width, scene.height);
        overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
        scene.style.cursor = "";
        fault(err);
        return;
      }
      /* The overlay clears on every scene paint: a stale outline is the
         overlay lying about the scene. Then it is re-drawn for wherever the
         cursor actually is — clearing alone made an entity's only affordance
         vanish at the moment it was clicked, and stay gone until the mouse
         moved again. */
      paints += 1;
      window.HOLO_APP.paints = paints;
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      scene.style.cursor = "";
      if (lastPointer) showHover(lastPointer);
    }

    /* Show as many WHOLE lines as the pane holds, newest at the bottom, with
       the top edge on a paragraph boundary. Scrolling to the pane's bottom
       alone slices whatever line straddles the top edge — half a line of
       type, and the narration is the only thing in this product that speaks
       to a player. Pinning the newest line to the TOP instead avoided the
       slice and then left two thirds of the pane blank with the transcript
       scrolled out of reach: the same voice lost a different way. */
    function scrollNarration() {
      var ps = narrationEl.querySelectorAll("p");
      if (!ps.length) return;
      var last = ps[ps.length - 1];
      var lastTop = last.offsetTop - narrationEl.offsetTop;
      if (last.offsetHeight >= narrationEl.clientHeight) {
        narrationEl.scrollTop = lastTop; // taller than the pane: start at its top
        return;
      }
      var target = lastTop + last.offsetHeight - narrationEl.clientHeight;
      for (var i = 0; i < ps.length; i++) {
        var o = ps[i].offsetTop - narrationEl.offsetTop;
        // The first boundary at or below the bottom-aligned position. It is
        // never past the newest line's own top, so the newest stays whole.
        if (o >= target) { target = o; break; }
      }
      narrationEl.scrollTop = target;
      // If the content could not reach that boundary, fall back to putting
      // the newest line at the top: a little blank below beats half a line
      // of type above.
      if (narrationEl.scrollTop !== target) narrationEl.scrollTop = lastTop;
    }

    function appendNarration(line) {
      /* The same refusal said twice in a row is the same refusal. §8 requires
         every refusal to narrate and this still does — the envelope stream
         and the §12.9 domain are untouched — but ten clicks on the chair used
         to fill a two-line pane with one sentence ten times, which is the
         product's whole visible voice spent saying nothing new. */
      var ps = narrationEl.querySelectorAll("p");
      var prev = ps.length ? ps[ps.length - 1] : null;
      if (prev && prev.getAttribute("data-line") === line) {
        // The same refusal said twice is the same refusal: leave the line
        // standing rather than filling a two-line pane with one sentence
        // six times. The count is NOT written to the surface — "(×4)" is a
        // string about the message stream's own behaviour, in the one voice
        // that speaks only about the world, and it is composed at runtime
        // where an audit that reads source literals would never find it.
        var n = (parseInt(prev.getAttribute("data-count"), 10) || 1) + 1;
        prev.setAttribute("data-count", String(n));
        scrollNarration();
        return;
      }
      var p = document.createElement("p");
      p.setAttribute("data-line", line);
      p.textContent = line;
      narrationEl.appendChild(p);
      scrollNarration();
    }

    function updateChrome(envelope) {
      if (envelope && typeof envelope.narration === "string") {
        appendNarration(envelope.narration);
      }
      window.HOLO.inventory.render(inventoryEl, harness.world, library, document);
    }

    /* dispatch owns the go veil because the veil has to be black BEFORE the
       harness moves the viewstate — the room you leave goes dark, then the
       room you arrive in fades up. `.instant` suppresses the transition for
       the black; a refused go (no events) lifts it in the same tick, so a
       closed door never flashes. */
    function dispatch(intent) {
      if (halted) return { turn_id: 0, intent: intent, events: [] };
      var envelope = harness.dispatch(intent);
      updateChrome(envelope);
      /* The veil goes black in the SAME task as the repaint, so no frame is
         ever painted showing the arrival at full brightness — then it holds,
         then it fades the new room up. Raising it after the repaint (a
         `transition: opacity` added on the way in) did the opposite: the
         destination cut in instantly and the player was blacked out for half
         a second afterwards. A refused `go` never reaches this branch, so a
         shut door does not flash. */
      // Any other intent ends the echo window: it is a double-click guard,
      // not a lock on travel.
      lastGo = (intent && intent.type === "go" && envelope.events.length > 0)
        ? { exit: intent.exit, at: Date.now() } : null;
      if (intent && intent.type === "go" && envelope.events.length > 0) {
        if (veilTimer) clearTimeout(veilTimer);
        veil.classList.add("instant", "on");
        veil.getBoundingClientRect(); // commit the black before the frame
        veilTimer = setTimeout(function () {
          veil.classList.remove("instant");
          veil.classList.remove("on");
          veilTimer = null;
        }, 140);
      }
      return envelope;
    }

    /* Canvas coords from a mouse event: CSS box -> 1536x1024 logical. */
    function canvasPoint(e) {
      var rect = scene.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (scene.width / rect.width),
        y: (e.clientY - rect.top) * (scene.height / rect.height)
      };
    }

    /* Pointing tolerance (chrome, never the renderer; the alpha regions are
       untouched), and it is bounded by the thing being aimed at rather than
       by a radius. Two earlier shapes both failed, in opposite directions:

       — A ring of sampled offsets returning the first non-null hit widened
         nothing for the key and the coin, because at every offset around
         them the hit is the desk or the shelf underneath.
       — A radius large enough to reach past them (22 CSS px, converted at
         the display scale) made every takeable outrank whatever it rested
         on: on a phone the notebook answered clicks on the drawer, on the
         chair, and on bare wall 85 canvas px away, and there was no point on
         the desk that could open the drawer at all.

       So: a takeable owns its own drawn rectangle plus a hand's-width
       margin, and nothing beyond it. Everywhere else the exact drawn pixel
       decides, and a point on nothing means nothing — dead space is dead at
       every display scale, which a radius in canvas pixels could not be.

       The residue, named rather than papered over: at phone scale the coin
       draws under two CSS pixels and cannot be hit by a finger. That is the
       apparent-size consequence of the open camera question (blueprint §5),
       not something pointing can fix. */
    var TAKEABLE_MARGIN_CSS = 4;

    function cssToCanvas() {
      var rect = scene.getBoundingClientRect();
      return rect.width > 0 ? scene.width / rect.width : 1;
    }

    function isTakeable(id) {
      var e = entityById(id);
      return !!(e && e.takeable);
    }

    /* Below this, in CSS pixels, a target is one a hand cannot hit exactly
       and the forgiveness applies. Above it the object is big enough to
       answer for itself, and letting it claim a margin would let it answer
       for its neighbours. */
    var SMALL_TARGET_CSS = 24;

    /* The drawn rectangle of a layout entry, clipped as the entry is. */
    function entryRect(e) {
      var b = e.swap
        ? { x: e.drawX + e.f * e.swap.origin.x, y: e.drawY + e.f * e.swap.origin.y,
            w: e.f * e.swap.image.width, h: e.f * e.swap.image.height }
        : { x: e.drawX, y: e.drawY, w: e.f * e.record.px.w, h: e.f * e.record.px.h };
      if (e.clip) {
        var x0 = Math.max(b.x, e.clip.x), y0 = Math.max(b.y, e.clip.y);
        var x1 = Math.min(b.x + b.w, e.clip.x + e.clip.w);
        var y1 = Math.min(b.y + b.h, e.clip.y + e.clip.h);
        b = { x: x0, y: y0, w: Math.max(0, x1 - x0), h: Math.max(0, y1 - y0) };
      }
      return b;
    }

    function rectArea(e) {
      var b = entryRect(e);
      return Math.max(0, b.w) * Math.max(0, b.h);
    }

    function entryOf(id) {
      if (!currentLayout) return null;
      for (var i = 0; i < currentLayout.length; i++) {
        if (currentLayout[i].id === id) return currentLayout[i];
      }
      return null;
    }

    function smallTargetAt(x, y, margin, k, skipId) {
      var best = null;
      var bestD = Infinity;
      if (!currentLayout) return null;
      for (var i = 0; i < currentLayout.length; i++) {
        var e = currentLayout[i];
        var b = entryRect(e);
        if (b.w <= 0 || b.h <= 0) continue;
        /* Any target too small to hit exactly, not only takeables. §7's
           amendment says "a widening tolerance ring for targets too small to
           hit exactly", and scoping it to `takeable` restored the blueprint's
           own named failure on a phone: the open door leaf draws 6 CSS px
           wide and is the ONLY pointer path from open back to closed, so
           `toggle door1 → closed` was authored, narrated, inside the §12.9
           domain, and unreachable by a finger. The bound stays the target's
           own rectangle plus a margin — that is what keeps a small object
           from answering for the furniture it stands on. */
        if (!isTakeable(e.id) &&
            Math.min(b.w, b.h) / k >= SMALL_TARGET_CSS) continue;
        if (e.id === skipId) continue;
        var dx = Math.max(b.x - x, 0, x - (b.x + b.w));
        var dy = Math.max(b.y - y, 0, y - (b.y + b.h));
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d <= margin && d < bestD) { bestD = d; best = e.id; }
      }
      return best;
    }

    function hitAtPoint(x, y) {
      if (!currentLayout) return null;
      var k = cssToCanvas();
      var near = smallTargetAt(x, y, TAKEABLE_MARGIN_CSS * k, k, null);
      if (near) return near;
      return window.HOLO.renderer.hitTest(currentLayout, library, x, y);
    }

    function hitAt(e) {
      var p = canvasPoint(e);
      return hitAtPoint(p.x, p.y);
    }

    /* The doorway opening the player is facing, if the point is inside it —
       the `go` target. Derived from the document by the renderer, so the
       picture and the affordance agree. */
    function apertureAt(p) {
      var list = window.HOLO.renderer.apertures(
        harness.world, harness.staging, library, metaFor(harness.viewstate), harness.viewstate);
      for (var i = 0; i < list.length; i++) {
        var a = list[i];
        if (p.x >= a.x && p.x < a.x + a.w && p.y >= a.y && p.y < a.y + a.h) return a;
      }
      return null;
    }

    /* What one point means, resolved once for both hover and click, in the
       order a player would expect:
         1. the exact pixel of a drawn entity — the leaf you are pointing at;
         2. an open doorway you are inside — travel;
         3. the tolerance ring, for targets too small to hit exactly.
       The ring has to come after the doorway or it swallows it: the leaf's
       16 px of forgiveness reached 40 px into an 86 px opening, so nearly
       half the visible gap answered "shut the door" while the way through
       had no room left. Inside the opening the opening wins. */
    function resolve(p) {
      var exact = currentLayout
        ? window.HOLO.renderer.hitTest(currentLayout, library, p.x, p.y) : null;
      /* Within its own drawn rectangle — plus TAKEABLE_MARGIN_CSS, a hand's
         slop and no more — a takeable outranks the thing it rests on:
         children draw over their host, so a see-through pixel of the key is
         desk pixels underneath, and dispatching `toggle desk1` there shuts
         the drawer over the reveal the player just earned. Past that margin
         it outranks nothing, which is what keeps a small object from
         answering for the furniture it stands on. */
      var k = cssToCanvas();
      var near = smallTargetAt(p.x, p.y, TAKEABLE_MARGIN_CSS * k, k, null);
      if (near && near !== exact) {
        /* A small target outranks the point only when it is clearly SMALLER
           than whatever is exactly under it — the thing you were aiming at,
           over the thing behind it. An absolute CSS threshold alone is not
           enough: at phone scale everything is small, and the desk (22 CSS px
           tall) then claimed a margin and answered for the chair standing in
           front of it. */
        var exactEntry = (exact === null || exact === undefined) ? null : entryOf(exact);
        var nearEntry = entryOf(near);
        if (!exactEntry ||
            (nearEntry && rectArea(nearEntry) < rectArea(exactEntry) * 0.6)) {
          return { kind: "entity", id: near };
        }
      }
      if (exact !== null && exact !== undefined) {
        return { kind: "entity", id: exact };
      }
      var ap = apertureAt(p);
      if (ap) {
        var leaf = entityById(ap.via);
        if (leaf && leaf.state === "open") return { kind: "doorway", aperture: ap };
        // A shut leaf fills its own opening, so this only happens where the
        // leaf's own pixels do not reach; the doorway still belongs to it.
        if (leaf) return { kind: "entity", id: ap.via };
      }
      return { kind: "none" };
    }

    function entityById(id) {
      for (var i = 0; i < harness.world.entities.length; i++) {
        if (harness.world.entities[i].id === id) return harness.world.entities[i];
      }
      return null;
    }

    /* Click -> intent. The doorway and its leaf are two different targets,
       which is what gives the door a way back: click through the OPENING to
       `go`, click the LEAF to toggle it (open it when shut, pull it to when
       it stands open). Before this split an opened exit door answered every
       click with `go` and no pointer path could ever close it again, while
       `go` itself had no target but the edge-on sliver of the swung leaf.
       Takeable -> take; anything else -> toggle (a chair click is the
       UI-emittable refusal). A click that hits neither a drawn entity nor an
       open doorway dispatches nothing — dead space is dead. */
    scene.addEventListener("click", function (e) {
      var r = resolve(canvasPoint(e));
      // Any deliberate click ends the double-click echo window, including one
      // that resolves to nothing: dead space dispatches no intent by design,
      // so keying the window on dispatched intents alone left it armed after
      // a click on nothing, and the next doorway click 250 ms later — a real
      // gesture with a real destination — vanished.
      if (r.kind !== "doorway") lastGo = null;
      if (r.kind === "doorway") {
        /* Swallow only the second half of a double-click: the SAME doorway,
           within the double-click window, with nothing else done in between.
           `arrive_facing` puts the doorway you came through under the very
           pixel you just clicked, so an accidental double-click walked you
           through and straight back behind a veil you never saw past. A
           blanket half-second lock on the only way between rooms is the
           opposite error — walk in, look back, walk out is a real thing to
           do, and it was silently dropped. So: the window is a double-click
           window, and ANY other intent ends it. The exit ids differ across
           the two halves of the echo (you arrive facing the door you came
           through, and it is the other room's exit), so the window is what
           identifies it, not the target. */
        var echo = lastGo && (Date.now() - lastGo.at) < DOUBLE_CLICK_MS;
        if (!echo) dispatch({ type: "go", exit: r.aperture.exit });
        return;
      }
      if (r.kind !== "entity") return;
      var entity = entityById(r.id);
      if (!entity) return;
      if (entity.takeable) {
        dispatch({ type: "take", entity: r.id });
      } else {
        dispatch({ type: "toggle", entity: r.id });
      }
    });

    /* The hover highlight traces the SILHOUETTE, not a bounding box: the
       entity's own drawn pixels are stamped into a scratch canvas, smeared
       one ring outward, tinted, and the interior punched back out, leaving a
       thin halo along the real edge. A rectangle around the sprite reads as
       an editor selecting an asset — it includes empty space and crosses
       whatever stands behind — and this highlight is the only thing on
       screen that tells a player anything here can be touched. */
    var HILITE = "rgba(226, 208, 160, 0.9)";
    var OUTLINE_PX = 3;
    var haloA = null;
    var haloB = null;

    /* The doorway's highlight is the opening's own edge — there is no
       silhouette to trace, the shape IS the rectangle in the wall. */
    function outlineRect(a) {
      overlayCtx.save();
      overlayCtx.strokeStyle = HILITE;
      overlayCtx.lineWidth = OUTLINE_PX;
      overlayCtx.strokeRect(
        a.x + OUTLINE_PX / 2, a.y + OUTLINE_PX / 2,
        a.w - OUTLINE_PX, a.h - OUTLINE_PX);
      overlayCtx.restore();
    }

    /* The scratch canvases are sized to the hovered entity's own rectangle,
       not to the frame. At full size this ran ~93 ms per mousemove on an
       unthrottled desktop — sixteen 1536×1024 blits and two full-frame
       composite passes for every pointer sample — which dropped the page to
       ~10 fps while the cursor was over anything. It is chrome, outside the
       scene hash, so bounding it costs nothing that is guaranteed. */
    function outline(entry) {
      var r = entryRect(entry);
      var pad = OUTLINE_PX + 2;
      var ox = Math.floor(r.x) - pad;
      var oy = Math.floor(r.y) - pad;
      var ow = Math.ceil(r.w) + pad * 2;
      var oh = Math.ceil(r.h) + pad * 2;
      if (ow <= 0 || oh <= 0) return;
      if (!haloA) {
        haloA = document.createElement("canvas");
        haloB = document.createElement("canvas");
      }
      if (haloA.width < ow || haloA.height < oh) {
        haloA.width = haloB.width = ow;
        haloA.height = haloB.height = oh;
      }
      var ac = haloA.getContext("2d");
      var bc = haloB.getContext("2d");
      ac.clearRect(0, 0, haloA.width, haloA.height);
      bc.clearRect(0, 0, haloB.width, haloB.height);
      ac.save();
      ac.translate(-ox, -oy);
      window.HOLO.renderer.stamp(ac, entry, {});
      ac.restore();
      for (var a = 0; a < 8; a++) {
        var ang = a * Math.PI / 4;
        bc.drawImage(haloA, OUTLINE_PX * Math.cos(ang), OUTLINE_PX * Math.sin(ang));
      }
      bc.globalCompositeOperation = "source-in";
      bc.fillStyle = HILITE;
      bc.fillRect(0, 0, haloB.width, haloB.height);
      bc.globalCompositeOperation = "destination-out";
      bc.drawImage(haloA, 0, 0);
      bc.globalCompositeOperation = "source-over";
      overlayCtx.save();
      if (entry.clip) {
        overlayCtx.beginPath();
        overlayCtx.rect(entry.clip.x, entry.clip.y, entry.clip.w, entry.clip.h);
        overlayCtx.clip();
      }
      overlayCtx.drawImage(haloB, 0, 0, ow, oh, ox, oy, ow, oh);
      overlayCtx.restore();
    }

    /* Hover: silhouette outline on the overlay canvas (chrome — the scene
       hash stays cursor-independent); cleared when nothing is under the
       cursor. */
    function showHover(p) {
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      if (!currentLayout) { scene.style.cursor = ""; return; }
      var r = resolve(p);
      if (r.kind === "none") { scene.style.cursor = ""; return; }
      scene.style.cursor = "pointer";
      if (r.kind === "doorway") {
        /* The way between rooms answers the cursor like everything else.
           Without this the one thing that moves you had no highlight and no
           pointer, while every object in the room had both. */
        outlineRect(r.aperture);
        return;
      }
      for (var i = 0; i < currentLayout.length; i++) {
        if (currentLayout[i].id === r.id) outline(currentLayout[i]);
      }
    }

    function clearHover() {
      lastPointer = null;
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      scene.style.cursor = "";
    }

    /* Touch never sends `mouseleave`, and a refused tap does not repaint, so
       without help every refused tap leaves a glowing halo around the thing it
       refused until the next tap somewhere else. Clearing on `pointerup` is
       not enough: the real event order on a touch device is
       pointerdown → pointerup → mousemove → mousedown → mouseup → click, so
       the compatibility `mousemove` arrives AFTER the clear and re-inks it.
       (A hand-built sequence in the other order made a test green over this
       for a while — synthetic events can always be arranged into the order
       the code happens to handle.) So a non-mouse pointer sets a flag, and
       the next mousemove spends it instead of drawing. */
    var swallowNextMove = false;

    scene.addEventListener("mousemove", function (e) {
      if (swallowNextMove) { swallowNextMove = false; clearHover(); return; }
      lastPointer = canvasPoint(e);
      showHover(lastPointer);
    });
    scene.addEventListener("mouseleave", clearHover);
    scene.addEventListener("pointerdown", function (e) {
      if (e.pointerType && e.pointerType !== "mouse") swallowNextMove = true;
    });
    scene.addEventListener("pointerup", function (e) {
      if (e.pointerType && e.pointerType !== "mouse") { swallowNextMove = true; clearHover(); }
    });

    document.getElementById("chevron-left").addEventListener("click", function () {
      dispatch({ type: "turn", dir: "left" });
    });
    document.getElementById("chevron-right").addEventListener("click", function () {
      dispatch({ type: "turn", dir: "right" });
    });
    window.addEventListener("keydown", function (e) {
      if (e.altKey || e.ctrlKey || e.metaKey) return; // browser gestures stay the browser's
      /* The transcript is a focusable scrollable region, so while it holds
         focus the arrows are its own — otherwise two keyboard affordances
         claim the same key and the room turns while a reader is trying to
         move through the prose. */
      if (document.activeElement === narrationEl) return;
      if (e.key === "ArrowLeft") dispatch({ type: "turn", dir: "left" });
      else if (e.key === "ArrowRight") dispatch({ type: "turn", dir: "right" });
    });

    var boot = harness.viewstate;
    var bootLoc = fixture.world.locations.filter(function (l) {
      return l.id === boot.location;
    })[0];
    if (!bootLoc || bootLoc.facings.indexOf(boot.facing) === -1) {
      var msg = "BOOT ERROR: viewstate " + JSON.stringify(boot) +
        " names no location/facing in world.json — every turn will be refused. " +
        "Fix fixtures/demo-study/viewstate.json and run: node tools/bake-fixtures.mjs";
      document.getElementById("status").textContent = msg;
      console.error(msg);
    } else {
      document.getElementById("status").textContent =
        "fixture bake fp " + fixture.fp +
        " — truth lives in fixtures/demo-study/*.json; after editing, run: node tools/bake-fixtures.mjs";
    }
    window.HOLO_APP = {
      harness: harness, paints: 0, library: library, dispatch: dispatch,
      /* `resolve` is where a click's meaning is decided — entity, doorway or
         nothing — and it is what a pointer-driven test should ask.
         `hitAtPoint` is only its entity half and returns null inside an open
         doorway; `apertureAt` is only the doorway half. Both are exposed
         because helpers use the difference between them to find a point that
         means travel, but a test that reaches for `hitAtPoint` expecting the
         page's routing will assert the wrong thing. */
      hitAtPoint: hitAtPoint, apertureAt: apertureAt, resolve: resolve
    };
    harness.subscribe(paint);
    harness.redraw();
    updateChrome(null);
  })();
  </script>
</body>
</html>
