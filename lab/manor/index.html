<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Manor by Purpose</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink: #ece4d2; --dim: #a89e88; --panel: rgba(18, 15, 12, 0.72); --line: rgba(236, 228, 210, 0.18); --brass: #c9a35c; }
  html, body { height: 100%; margin: 0; background: #070605; color: var(--ink); overflow: hidden; font: 12px "IBM Plex Mono", ui-monospace, monospace; }
  canvas { display: block; touch-action: none; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; background: #070605; color: var(--dim); z-index: 5; }
  #status[hidden] { display: none; }
  #where { position: fixed; left: 14px; top: 12px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); }
  #where .n { font: 600 20px "Cormorant Garamond", Georgia, serif; color: var(--brass); letter-spacing: .04em; }
  #where .f { color: var(--dim); }
  #keys { position: fixed; left: 14px; bottom: 12px; padding: 6px 10px; background: var(--panel); border: 1px solid var(--line); color: var(--dim); }
  kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font: inherit; }
  #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(236,228,210,0.7); z-index: 2; pointer-events: none; }
  #cross.icon { width: 24px; height: 24px; margin: -12px 0 0 -12px; background: none; border-radius: 0; filter: drop-shadow(0 0 2px rgba(0,0,0,0.7)); }
  #cross[hidden], #line[hidden], #gate[hidden] { display: none !important; }
  #line { position: fixed; left: 0; right: 0; margin: 0 auto; width: fit-content; bottom: 70px; max-width: min(60ch, calc(100vw - 32px)); box-sizing: border-box; text-align: center; background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; z-index: 2; cursor: pointer; touch-action: manipulation; }
  @media (pointer: coarse) { #line { bottom: calc(160px + env(safe-area-inset-bottom)); } }
  #line.more::after { content: " ›"; color: var(--brass); }
  #gate { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); cursor: pointer; z-index: 3; border: 1px solid var(--brass); padding: 10px 18px; background: var(--panel); }
  #end { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); max-width: min(46ch, 88vw); text-align: center; font: 600 24px "Cormorant Garamond", Georgia, serif; color: var(--brass); background: var(--panel); border: 1px solid var(--line); padding: 16px 22px; z-index: 4; }
  #end small { display: block; margin-top: 8px; font: 12px "IBM Plex Mono", monospace; color: var(--dim); }
  @media (max-width: 640px), (pointer: coarse) { #where .n { font-size: 16px; } #keys { display: none; } }
</style>
</head>
<body>
<div id="status">raising the house…</div>
<div id="where"><div class="n">—</div><div class="f"></div></div>
<div id="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · mouse look · <kbd>shift</kbd> stride · walk into a stair to climb · <kbd>E</kbd>/click use · <kbd>G</kbd> take · <kbd>C</kbd> crouch · double-click go there</div>
<div id="gate">click to walk</div>
<div id="cross" hidden></div>
<div id="line" hidden></div>
<script type="importmap">{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.min.js",
  "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.min.js",

}}</script>
<script type="module">
// The manor by purpose (R47): a c.1660 gentry seat's program laid into a hybrid E-plan, every room
// built by its type, the muniment room from its brief, doors that work, only what you can see drawn.
// ?fresh starts a new world; ?room=<id> starts you there; ?plan=banqueting the octagonal banqueting house; ?perf=1 shows the engine's numbers.
import * as THREE from "three/webgpu";
import { RectAreaLightTexturesLib } from "three/addons/lights/RectAreaLightTexturesLib.js";
import { makeKit } from "../painted/procedural.js";
import { textureLog } from "../painted/texjobs.js";
import { strongroomMaterials } from "../brief/strongroom.js";
import { makeRender } from "../../src/make/render.js";
import { nodeify } from "../../src/make/nodes.js";
import { makeWarm } from "../../src/make/warm.js";
import { buildManor } from "../../src/make/manor.js";
import { makeWalk } from "../../src/make/walk.js";
import { planBanqueting } from "../../src/make/plans/banqueting.js";
import { framesOf } from "../../src/make/walls.js";
import { coplanar } from "../../src/make/coplanar.js";
import { makePool } from "../../src/make/lightpool.js";
import { checkScene } from "../../src/make/scene.js";
import { matchKinds } from "../../src/make/match.js";
import { planStoryHall } from "../../src/make/plans/story-hall.js";
import { compileStory, bodyAt } from "../../src/make/story.js";
import { playStory } from "../../src/make/story-play.js";
import { STORY_ROOM_TYPES } from "../../src/make/rooms/story.js";
import { makeSite, makeOutdoorWalk } from "../../src/make/terrain.js";
import { makeGround, groundMaterial, groundTextures } from "../../src/make/terrain-mesh.js";
import { settled, warmTextures } from "../painted/texjobs.js";
import { LIB as OUT } from "../painted/outgen.js";
import { buildForecourt } from "../../src/make/forecourt.js";
import { makeFields } from "../../src/make/fields.js";
import { caseRequired, playCase, caseSettings } from "../../src/make/case-play.js";
import { checkCase, fairPlay } from "../../src/make/case.js";
import { makeNarrator } from "../../src/make/narrator.js";
import { makePresence } from "../../src/make/presence.js";
import { makeVoice } from "../../src/make/voice.js";
import { makeTalkPanel } from "../ui/talk-panel.js";
import { makeHillside, hillsideTextures } from "../../src/make/hillside.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";
import { rng as rngOf, seedOf } from "../../src/make/id.js";
import { build } from "../../src/make/index.js";
import { soundness } from "../../src/make/sound.js";
import { compileRoom } from "../house/plan-compile.js";
import { planHybridE, GENTRY_SEAT_1660, ROOM_TYPES_1660, lookC1660, makeWorks, makeWorld, kinds, kindOf, hashOf, GENERATOR } from "../../src/make/index.js";
import { cues } from "../ui/cues.js";
import { touchControls, isTouch, fullscreenButton, actionButton, crouchButton } from "../touch.js";
fullscreenButton();

const Q = new URLSearchParams(location.search), $ = (id) => document.getElementById(id);
// what the house says to you (a clue noted, the narrator's beat, a door that won't give): one line at a time, in turn, each
// up as long as it takes to read (a beat is a paragraph: 4.5 s had shown a third of it, and the next line wiped it); a tap
// on it goes on to the next
window.__said = []; const sayQ = [];
const sayNext = () => { clearTimeout(say.t); const l = $("line"), t = sayQ.shift(); if (!t) { l.hidden = true; return; }
  l.textContent = t; l.hidden = false; l.classList.toggle("more", sayQ.length > 0); say.t = setTimeout(sayNext, Math.min(24000, 1800 + 330 * t.split(/\s+/).length)); };
const say = (t) => { if (!t) return; window.__said.push(t); if (sayQ.at(-1) === t) return; sayQ.push(t); if ($("line").hidden) sayNext(); else $("line").classList.add("more"); };
$("line").addEventListener("pointerdown", (e) => { e.stopPropagation(); sayNext(); });
const step = (t) => { $("status").textContent = t + "…"; return new Promise(r => setTimeout(r)); };

// ---- the world document: the house's plan sealed into it the first time it is seen (Kabe's P1): a
// better generator later never moves a wall you have walked past; the story's own magic may
const hearths = Object.fromEntries(Object.entries(ROOM_TYPES_1660).map(([k, v]) => [k, v.hearth]));
// ?plan=banqueting builds the octagonal garden banqueting house instead (R54 5e: rooms of any shape)
// ?plan=alice-hall: a place from a book (R49): the scene document the one AI step wrote from the text, checked here
// (every quote word for word in the text), its things matched to kinds, laid out by the story-hall plan type
const STORY = Q.get("plan") === "alice-hall" ? await (async () => { const t0 = performance.now();
  const [scene, text] = await Promise.all([fetch("../alice/hall.json").then(r => r.json()), fetch("../alice/hall.txt").then(r => r.text())]);
  const check = checkScene(scene, text); if (!check.ok) throw new Error("scene refused: " + check.findings.map(f => `${f.at}: ${f.what}`).join("; "));
  const match = matchKinds(scene, kinds()), plan = planStoryHall(scene, { kinds: match.kinds });
  return { scene, text, check, match, plan, story: compileStory(scene), ms: Math.round(performance.now() - t0) }; })() : null;
window.__story = () => STORY && { quotes: STORY.check.quotes, match: STORY.match, chosen: STORY.plan.chosen, unread: STORY.story.unread, ms: STORY.ms };
const fresh = STORY ? STORY.plan : Q.get("plan") === "banqueting" ? planBanqueting() : planHybridE(GENTRY_SEAT_1660, { hearths });
// what the story requires, placed first in its room with what holds it (R54 step 6; pattern-buffer will supply
// these): ?require=key/iron@study:table/joined-with-drawer.drawer (kind@room, optionally :in-kind.slot), comma-separated
if (Q.get("require")) fresh.required = Q.get("require").split(",").map(t => { const [what, inside] = t.split(":"), [kind, room] = what.split("@"), [ik, slot] = (inside || "").split(".");
  return { kind, room, ...(inside ? { in: { kind: ik, slot: slot || "drawer" } } : {}) }; });
// ?case=case-1660: a mystery in the house (M7): its things placed first, by story id, with what holds them
const CASE = Q.get("case") ? await (await fetch(`../case/${Q.get("case")}.json`)).json() : null;
if (CASE) fresh.required = [...(fresh.required || []), ...caseRequired(CASE, fresh, new Set(kinds().map(k => k.kind)))];
// while the generator is still being written, a world starts afresh when its output changes; at release
// the plan's hash leaves this key, and a world keeps the plan it was sealed with for good
const KINDS = kinds().map(k => [k.kind, k.pin]), WKEY = `holo-emitter/manor/world/${hashOf(KINDS)}/${hashOf(fresh)}`;
let doc = null; try { if (Q.has("fresh")) localStorage.removeItem(WKEY); else doc = JSON.parse(localStorage.getItem(WKEY) || "null"); } catch (_) {}
const world = makeWorld(doc), keep = () => { try { localStorage.setItem(WKEY, JSON.stringify(world.doc)); } catch (_) {} };
// a case's own progress kept beside the world (src/make/case-play.js snapshot); ?fresh clears it, and then leaves the
// address, so a phone that reloads the tab (iOS does, when it is short of memory) takes the case up again, not afresh
const CKEY = CASE ? `${WKEY}/case/${CASE.id}` : null; let caseSaved = null;
try { if (CKEY && Q.has("fresh")) localStorage.removeItem(CKEY); else if (CKEY) caseSaved = JSON.parse(localStorage.getItem(CKEY) || "null"); } catch (_) {}
if (Q.has("fresh")) { const u = new URL(location.href); u.searchParams.delete("fresh"); history.replaceState(null, "", u); }
const plan = world.seal("manor", { plan: fresh, kinds: KINDS, generator: GENERATOR }).plan;
keep();
const brief = await (await fetch("../brief/manor-1660.json")).json();

// ---- the renderer, the kit, the house
// a place with an outside (the manor, the banqueting house) is drawn with log depth, near and far (fps lab: a 5 km view holds
// at no measurable cost); a story's hall underground is not
const OUTDOOR = !STORY && Q.get("outdoor") !== "0";
const ENG = await makeRender({ outdoor: OUTDOOR }), renderer = ENG.renderer; window.__eng = ENG;
THREE.RectAreaLightNode.setLTC(RectAreaLightTexturesLib.init());
await step("growing oak, laying flags, slaking lime");
// (defer: the kit's textures are drawn in its workers while the house goes up, or come from the last visit's cache)
// the outside's textures drawn in the worker pool while the house is built (src/make/terrain-mesh.js, hillside.js)
if (!STORY && Q.get("outdoor") !== "0") { await warmTextures(3000, [OUT]); groundTextures(THREE); hillsideTextures(THREE); }
const K = await makeKit(THREE, { floor: [8, 8], defer: true }), S = strongroomMaterials(THREE, K), look1660 = lookC1660(THREE, K, S);
await step("raising the house, room by room, each by its purpose");
const manor = buildManor({ outside: !STORY && Q.get("outdoor") !== "0", settleRooms: Q.get("roomsettle") === "1", furnished: Q.get("nofurn") !== "1", plan, types: { ...ROOM_TYPES_1660, ...STORY_ROOM_TYPES }, K, S, look: look1660, brief, bundles: ENG.backend === "webgpu" && Q.get("bundles") === "1" });     // bundles drop some wall meshes yet: on request only
window.__rig = () => rig.map(l => ({ i: l.intensity, p: l.position.toArray().map(v => +v.toFixed(2)), w: l.width, h: l.height }));
const scene = new THREE.Scene(); window.__scene = scene; window.__THREE = THREE; scene.background = new THREE.Color(0x9fb2c2); scene.add(manor.scene);
nodeify(scene);
ENG.mark("built");
// every texture whole before the first frame (lab/painted/texjobs.js); what each cost: __textures()
await step("finishing the textures"); await K.ready(); ENG.mark("textures");
window.__textures = textureLog;

// ---- light: one sun, its shadow map drawn once (the house is still); a soft fill; four window lights
// that follow you room to room, so the count of lights never changes and nothing recompiles
const ext = plan.rooms.reduce((b, q) => ({ x0: Math.min(b.x0, q.rect.x0), x1: Math.max(b.x1, q.rect.x1), y0: Math.min(b.y0, q.rect.y0), y1: Math.max(b.y1, q.rect.y1) }), { x0: 1e9, x1: -1e9, y0: 1e9, y1: -1e9 });
const cx = (ext.x0 + ext.x1) / 2, cy = (ext.y0 + ext.y1) / 2, reach = Math.hypot(ext.x1 - ext.x0, ext.y1 - ext.y0) / 2 + 4;
const sun = new THREE.DirectionalLight(0xffe2b8, 1.8); sun.position.set(cx + 14, 22, -cy + 30); sun.target.position.set(cx, 0, -cy);
sun.castShadow = true; sun.shadow.mapSize.set(ENG.phone ? 2048 : 4096, ENG.phone ? 2048 : 4096); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left: -reach, right: reach, top: reach, bottom: -reach, near: 1, far: 140 });
sun.shadow.autoUpdate = false; sun.shadow.needsUpdate = true;
scene.add(sun, sun.target, new THREE.HemisphereLight(0xc8d0d8, 0x3a2c1e, STORY ? 0.14 : 0.55));   // a story's hall underground: "that dark hall"
// the light that follows what you see (Kabe, 2026-10-06: "all of the lighting elements should be deployed as
// long as they are within the visual space"; "kitchen passage to kitchen jumps in the lighting again"): a fixed
// pool, so the count of lights never changes and nothing recompiles (src/make/lightpool.js). The windows and lit
// hearths of every room in view are ranked by what each gives where you stand, not by which room you are in, and
// every change fades, so crossing a threshold or opening a door never jumps.
const rig = Array.from({ length: 8 }, () => { const l = new THREE.RectAreaLight(0xe4ecf2, 0, 1, 1); scene.add(l); return l; });
const fires = Array.from({ length: STORY ? 4 : 3 }, () => { const l = new THREE.PointLight(0xff9a4a, 0, 10, 1.8); scene.add(l); return l; });
const winItems = manor.windows.map((w, i) => ({ key: i, room: w.room, at: w.c, size: w.w * w.h, base: 9, w }));
let fireItems = manor.hearths.filter(h => h.lit).map((h, i) => ({ key: i, room: h.room, at: h.at, size: h.big ? 2 : 1, base: h.big ? 16 : 8, h }));
// lights a room's own builder made (the muniment room's barred windows and door reveal, a candle in it) join the pools too:
// out of the scene, so the count of lights never changes (seeing that room had taken the scene from 13 lights to 16 and
// recompiled everything in view: a 2-4 s hitch), each still driven by its own code, its strength read from it each frame
{ manor.scene.updateMatrixWorld(true); const P = new THREE.Vector3(), Q = new THREE.Quaternion(), D = new THREE.Vector3();
  for (const [id, r] of manor.rooms) { const own = [...(r.lights || [])]; r.grp.traverse(o => { if (o.isPointLight && !own.includes(o)) own.push(o); });
    for (const l of own) { l.getWorldPosition(P); l.getWorldQuaternion(Q); const at = P.clone();
      if (l.isRectAreaLight) { D.set(0, 0, -1).applyQuaternion(Q); const w = { w: l.width, h: l.height, c: at, into: at.clone().addScaledVector(D, 5) };
        const it = { key: `own:${id}:${winItems.length}`, room: id, at, size: l.width * l.height, w }; Object.defineProperty(it, "base", { get: () => l.intensity }); winItems.push(it); }
      else if (l.isPointLight) { const it = { key: `own:${id}:${fireItems.length}`, room: id, at, size: 1, h: { at: at.clone().setY(at.y - 0.55), into: at.clone().setY(at.y - 0.55) } };
        Object.defineProperty(it, "base", { get: () => l.intensity }); fireItems.push(it); }
      else continue;
      l.userData.pooled = true; l.removeFromParent(); } } }
const winPool = makePool(rig, { place: (l, { w }) => { l.width = w.w; l.height = w.h; l.position.copy(w.c); l.lookAt(w.into); } });
const firePool = makePool(fires, { place: (l, { h }) => { l.position.set(h.at.x, h.at.y + 0.55, h.at.z); l.position.lerp(h.into, 0.15); } });
let inView = new Set(), lightsDirty = true, snapLights = true;
// (a lamp put out gives no light: its switch's state, 2026-10-07 "light off doesnt change the lighting")
const alight = (it) => !it.thing || !it.thing.kind.affordances?.light || works.stateOf(it.thing, "light") !== "out";
function lightView(at) { winPool.update(winItems.filter(it => inView.has(it.room)), at); firePool.update(fireItems.filter(it => inView.has(it.room) && alight(it)), at); }
// the fires flicker, and the flames with them, while any is in view
function flicker(now) {
  const t = now / 1000; let any = false;
  fires.forEach((l, i) => { if (!l.intensity) return; any = true; l.intensity *= 0.82 + 0.1 * Math.sin(t * 7.3 + i * 2) + 0.08 * Math.sin(t * 13.1 + i); });
  for (const f of manor.flames) { if (!f.parent.parent.visible) continue; any = true; const p = f.userData.phase; f.scale.set(1, 0.8 + 0.25 * Math.sin(t * 9 + p) + 0.1 * Math.sin(t * 17 + p * 2), 1); }
  return any;
}
window.__lights = () => ({ windows: winPool.slots.map(s => s.key === null ? null : { room: s.item.room, key: s.key, level: +s.level.toFixed(2) }),
  fires: firePool.slots.map(s => s.key === null ? null : { room: s.item.room, level: +s.level.toFixed(2) }) });

// ---- outside (R46): the site's ground around the house, built in tiles as you go (src/make/terrain.js,
// terrain-mesh.js), a sky and the haze of distance
const site = OUTDOOR ? makeSite(plan) : null, fields = site ? makeFields(site) : null;
if (fields) site.relief(fields.furrowZ);          // ridge and furrow in the ground's height, before anything samples it
const ground = site ? makeGround(THREE, site, { bundle: ENG.backend === "webgpu" && Q.get("groundbundle") !== "0", material: groundMaterial(THREE, { rng: (n) => rngOf(seedOf(n)) }) }) : null;
// the fields' walls, hedges, gates and trees (src/make/hillside.js), in tiles round you; impostors drawn once by this renderer, lit by this sun
const hill = site ? makeHillside(THREE, site, fields, { renderer, near: ENG.phone ? 100 : 150, nearTile: ENG.phone ? 100 : 150,
  light: { sun: sun.color.getHex(), sunI: sun.intensity, sky: 0xc8d0d8, ground: 0x3a2c1e, hemi: 0.55, dir: sun.position.clone().sub(sun.target.position).toArray() } }) : null;
if (hill) scene.add(hill.group);
window.__site = site; window.__ground = ground; window.__hill = hill;
if (ground) { scene.add(ground.group);
  scene.fog = new THREE.Fog(0xb7c4cf, 220, 1500);
  // the sky: a dome that goes with you, pale at the horizon, deeper overhead
  const sg = new THREE.SphereGeometry(2400, 32, 16), col = [], top = new THREE.Color(0x6f8fb4), hor = new THREE.Color(0xc9d4dc), c = new THREE.Color();
  for (let i = 0; i < sg.attributes.position.count; i++) { const y = sg.attributes.position.getY(i) / 2400; c.copy(hor).lerp(top, Math.max(0, Math.min(1, y * 1.6))); col.push(c.r, c.g, c.b); }
  sg.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  const sky = new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false })); sky.renderOrder = -1; sky.name = "sky";
  sky.onBeforeRender = () => sky.position.copy(camera.position); scene.add(sky); window.__sky = sky; }

// ---- things that work: every door, the strongroom's drawers and chest; state is the world document's
const store = world.store();
let viewDirty = true;
const works = makeWorks(THREE, { store, save: (st) => { world.save(st, "player", (id) => works.things.get(id)); keep(); }, say,
  onMove: (b, aff) => { if (aff === "leaf") viewDirty = true; },      // a door moved: what can be seen may have changed
  ask: (need, want) => need === "holding" && false });
for (const b of manor.things) works.add(b);
window.__works = works; window.__manor = manor; window.__plan = plan;
// the story in play (R49): sizes, reach, deeds, what the text brings in later, the story's magic, the goal
const SP = STORY ? playStory({ THREE, scene: STORY.scene, story: STORY.story, text: STORY.text, plan, manor, works, build, K, look: look1660, say,
  setVar: (name, v) => { store[`$${name}`] = v; world.save(store, "player", (id) => works.things.get(id)); keep(); } }) : null;
window.__sp = SP;
// the forecourt's railed wall, its piers and its gates (src/make/forecourt.js), the gates things that work
const FC = site ? buildForecourt({ THREE, K, look: look1660, build, plan, site, works, materials: { merge: mergeGeometries, stone: look1660.roles.ashlar, iron: look1660.roles.iron } }) : null;
if (FC) scene.add(FC.group); window.__fc = FC;
if (SP) { const b3 = new THREE.Box3(), c = new THREE.Vector3();
  // each lamp's light where its flame hangs, in the pool the fires use (oil lamps flicker a little too)
  fireItems = fireItems.concat(SP.lamps.map((b, i) => { b3.setFromObject(b.node); b3.getCenter(c); const at = c.clone(); at.y = b3.min.y + 0.12;
    return { key: 100 + i, room: plan.entrance, at, size: 1, base: 5, thing: b, h: { at: at.clone().setY(at.y - 0.55), into: at.clone().setY(at.y - 0.55) } }; }));
  SP.onGoal = () => { const e = document.createElement("div"); e.id = "end"; e.innerHTML = "Through the little door. <small>The first Alice proof ends here: the garden is Chapter II's and beyond.</small>"; document.body.append(e); };
