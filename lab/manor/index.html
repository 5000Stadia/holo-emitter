<style>

  html, body { height: 100%; margin: 0; background: #070605; color: var(--ink); overflow: hidden; font: 12px "IBM Plex Mono", ui-monospace, monospace; }
  canvas { display: block; touch-action: none; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; background: #070605; color: var(--dim); z-index: 5; }
  #status[hidden] { display: none; }
  /* the first screen (R65; Teleoperator's title, design/references/teleoperator/): a still of the very view you will
     start in, rendered from the page itself (tools/title-stills.mjs). A tiny copy inlined below paints at once, the full one
     sharpens over it, and a slow drift run by the compositor keeps it alive while the house is raised; at walkable it
     fades into the live frame */
  #still { position: fixed; inset: 0; z-index: 4; overflow: hidden; background: #070605 center / cover no-repeat; transition: opacity .7s ease; pointer-events: none; }
  #still img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #still.drift img, #still.drift { animation: drift 40s ease-out forwards; }
  #still.gone { opacity: 0; }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { #still.drift, #still.drift img { animation: none; } }
  #status.over { background: linear-gradient(to bottom, transparent 62%, rgba(7, 6, 5, .78)); place-items: end center; padding-bottom: calc(9vh + env(safe-area-inset-bottom)); box-sizing: border-box; color: var(--ink); text-shadow: 0 1px 3px #000; }
  #where { position: fixed; left: 14px; top: 12px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); }
  #where .n { font: 600 20px "Cormorant Garamond", Georgia, serif; color: var(--brass); letter-spacing: .04em; }
  #where .f { color: var(--dim); }
  #keys { position: fixed; left: 14px; bottom: 12px; padding: 6px 10px; background: var(--panel); border: 1px solid var(--line); color: var(--dim); }
  kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font: inherit; }
  #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(236,228,210,0.7); z-index: 2; pointer-events: none; }
  #cross.icon { width: 24px; height: 24px; margin: -12px 0 0 -12px; background: none; border-radius: 0; filter: drop-shadow(0 0 2px rgba(0,0,0,0.7)); }
  #cross[hidden], #line[hidden], #gate[hidden] { display: none !important; }
  #line { position: fixed; left: 0; right: 0; margin: 0 auto; width: fit-content; bottom: 70px; max-width: min(60ch, calc(100vw - 32px)); box-sizing: border-box; text-align: center; background: var(--panel); border: 1px solid var(--line); padding: 8px 14px; z-index: 2; cursor: pointer; touch-action: manipulation; }
  /* a phone: the line up top, under the room's name, clear of both thumbs and of what you have just opened below the
     dot (it had sat over the stick's ground, and a thumb set down on it to walk dismissed it instead, and walked nowhere);
     it takes no touch of its own: a tap on it still goes on to the next (tapAt), a drag begun on it walks or looks */
  @media (pointer: coarse) { #line { bottom: auto; top: calc(70px + env(safe-area-inset-top)); pointer-events: none; }
    #where { left: calc(14px + env(safe-area-inset-left)); top: calc(12px + env(safe-area-inset-top)); } }
  @media (pointer: coarse) and (orientation: landscape) { #line { top: calc(10px + env(safe-area-inset-top)); max-width: min(60ch, calc(100vw - 440px)); } }
  #line.more::after { content: " ›"; color: var(--brass); }
  #gate { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); cursor: pointer; z-index: 3; border: 1px solid var(--brass); padding: 10px 18px; background: var(--panel); }
  #end { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); max-width: min(46ch, 88vw); text-align: center; font: 600 24px "Cormorant Garamond", Georgia, serif; color: var(--brass); background: var(--panel); border: 1px solid var(--line); padding: 16px 22px; z-index: 4; }
  #end small { display: block; margin-top: 8px; font: 12px "IBM Plex Mono", monospace; color: var(--dim); }
  @media (max-width: 640px), (pointer: coarse) { #where .n { font-size: 16px; } #keys { display: none; } }
</style>

(() => { const Q = new URLSearchParams(location.search), OK = new Set(["case", "plan", "fresh", "still", "perf", "webgl", "webgpu", "stopwatch", "carry"]);
  const key = Q.get("plan") === "alice-hall" || Q.get("plan") === "banqueting" ? (Q.get("case") ? null : Q.get("plan"))
    : Q.get("case") === "case-1660" ? "case-1660" : Q.get("plan") || Q.get("case") ? null : "manor";
  const S = window.__stillsMade[key], want = Q.get("still") ?? (navigator.webdriver ? "0" : "1");
  if (!S || want === "0" || [...Q.keys()].some(k => !OK.has(k))) return;
  // a phone held upright sees the room wider (the page's fov opens to 88° as the aspect narrows): its own still, made so
  const tall = innerHeight > innerWidth * 1.2, el = document.getElementById("still"), img = new Image();
  el.style.backgroundImage = `url(${tall ? S.thumbTall : S.thumb})`; el.hidden = false; el.dataset.key = key;
  img.decoding = "async"; img.fetchPriority = "high"; img.alt = ""; img.src = `stills/${key}${tall ? "-tall" : ""}.webp?${S.v}`; el.append(img);
  // the house is raised in one long block that paints nothing: the page waits (at most 0.4 s) for the full still to be
  // on screen before it starts, so what you look at meanwhile is the sharp one
  window.__stillShown = new Promise(res => { img.decode().then(() => requestAnimationFrame(() => requestAnimationFrame(res)), res); setTimeout(res, 400); });
