<script type="module">

};

const tKit = performance.now();

{ const g = new THREE.PlaneGeometry(6, 4); const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * 6, uv.getY(i) * 4);

const tB = performance.now();
const obj = OBJECTS[kind](); scene.add(obj); window.__obj = obj;
const tObj = performance.now();
// light: a window's daylight from the left front, a soft fill, a little bounce
const sun = new THREE.DirectionalLight(0xfff0dc, 2.2); sun.position.set(-2.5, 3.2, 3.5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 3, bottom: -1, near: 0.5, far: 12 }); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xdcd8d0, 0x4a4036, 0.9));
const win = new THREE.RectAreaLight(0xe8eef2, 3.5, 1.2, 1.6); win.position.set(-2.4, 1.6, 2); win.lookAt(0, 1.2, 0.4); scene.add(win);

// every material to its node twin (src/make/nodes.js), once, before the first frame
const twins = nodeify(scene);

let az = 0.35, el = 0.12, dist = 3.6, ty = 1.15;
if (obj.userData.view) [az, el, dist, ty] = obj.userData.view;
const aimCam = () => { camera.position.set(Math.sin(az) * Math.cos(el) * dist, ty + Math.sin(el) * dist, Math.cos(az) * Math.cos(el) * dist); camera.lookAt(0, ty, 0.2); };
window.__view = (a, e, d, y = ty) => { az = a; el = e; dist = d; ty = y; aimCam(); };
const lineEl = document.getElementById("line"); let lineTimer = null;
const say = (t) => { if (!t) return; lineEl.textContent = t; lineEl.hidden = false; clearTimeout(lineTimer); lineTimer = setTimeout(() => { lineEl.hidden = true; }, 5000); };
const works = makeWorks(THREE, { say }); for (const b of built) works.add(b); window.__works = works;
if (obj.userData.rules) works.rules(obj.userData.rules);
// what stood as grid turns real when its part arrives: rebuilt at the same address, in the same place
onPartArrives(() => { for (const b of [...built]) if (b.placeholder) { const nb = build(THREE, K, look, b.kind.kind, b.address, {}, {}); if (nb.placeholder) continue;
  nb.node.position.copy(b.node.position); nb.node.rotation.copy(b.node.rotation); nodeify(nb.node); b.node.parent.add(nb.node); b.node.parent.remove(b.node); built.splice(built.indexOf(b), 1, nb); works.add(nb); say(`${nb.kind.noun[0].toUpperCase() + nb.kind.noun.slice(1)} arrives: its last part was written.`); } });
if (obj.userData.arrives) setTimeout(() => definePart("paper_tag", { build(c, { text, at = [0, 0, 0] }) {
  // a paper label tied round a neck: a small card with the words, and the string that holds it
  const cv = document.createElement("canvas"); cv.width = 256; cv.height = 128; const g2 = cv.getContext("2d");
  g2.fillStyle = "#efe3c4"; g2.fillRect(0, 0, 256, 128); g2.fillStyle = "#2a1c10"; g2.textAlign = "center"; g2.textBaseline = "middle"; g2.font = "bold 46px Georgia, serif"; g2.fillText(text, 128, 66);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; const paper = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, side: THREE.DoubleSide }); paper.userData.cls = "paper";
  const card = new THREE.PlaneGeometry(0.07, 0.035); card.rotateX(-0.12); card.translate(at[0], at[1] - 0.045, at[2] + 0.04); c.add(card, paper);
  const loop = new THREE.TorusGeometry(0.0125, 0.0012, 4, 20); loop.rotateX(Math.PI / 2); loop.translate(at[0], at[1] + 0.025, at[2]); c.add(loop, "tape");
} }), 3000);
const use = (t) => { if (!t) return; const r = works.act(t); if (r.refused) say(r.refused[0].toUpperCase() + r.refused.slice(1) + "."); else if (r.said?.length) say(r.said.join("; ") + "."); else if (r.took) say(`You take ${r.took}.`); };
const takeIt = (t) => { if (!t) return; const r = works.take(t); say(r.refused ? r.refused : `You take ${r.took}.`); };
let pointer = null;
addEventListener("keydown", e => { if (e.code === "KeyG" && pointer) takeIt(aim(pointer)); });
const ray = new THREE.Raycaster();
const aim = (e) => { ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera); return works.find(ray.intersectObjects(works.meshes(), true)[0]); };
let drag = null, downAt = null;
renderer.domElement.addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY]; downAt = [e.clientX, e.clientY]; });

addEventListener("wheel", e => { dist = Math.max(0.4, Math.min(8, dist * (1 + e.deltaY * 0.001))); aimCam(); });
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
aimCam();
let tris = 0, meshes = 0, bytes = 0; obj.traverse(o => { if (!o.isMesh) return; meshes++;
  const t = (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; tris += o.isInstancedMesh ? t * o.count : t;
  for (const a of Object.values(o.geometry.attributes)) bytes += a.array.byteLength; if (o.isInstancedMesh) bytes += o.instanceMatrix.array.byteLength + (o.instanceColor ? o.instanceColor.array.byteLength : 0); });
window.__receipt = () => ({ object: kind, build_ms: Math.round(tObj - tB), kit_ms: Math.round(tKit - t0), meshes, tris: Math.round(tris), geometry_bytes: bytes, ...obj.userData });
document.getElementById("info").textContent = `${kind}: built in ${Math.round(tObj - tB)} ms · ${meshes} meshes · ${(tris / 1000).toFixed(0)}k tris${obj.userData.books ? ` · ${obj.userData.books} books` : ""}\ndrag to turn round it · wheel to come closer · click what works · G (or shift-click) to take`;
// ---- checking a built thing (Kabe, 2026-10-06: "a smart way to check on a built object at multiple angles
// and in its different toggle states"). Two ways, both at authoring, never in play:
// 1. __opensOnto([kinds]): no picture. Open everything that opens, then look straight in through each lid,
//    door or leaf's opening, a grid of rays from outside its closed face, and measure how far you see past
//    where it stood. A few centimetres means it opens onto solid (a tub turned solid, a cupboard with no
//    inside). Milliseconds a kind.
window.__opensOnto = (names = furniture1660.map(k => k.kind).concat(kinds().map(k => k.kind)), min = 0.03) => {
  const out = [], rc = new THREE.Raycaster(), seen = new Set();
  for (const name of names) { if (seen.has(name)) continue; seen.add(name);
    const k = kindOf(name); if (!k?.affordances) continue;
    let b; try { b = build(THREE, K, look, name, `check/${name}`); } catch (e) { out.push({ kind: name, error: String(e) }); continue; }

      const sgn = Math.sign(c[ax] - mid[ax]) || 1, dir = new THREE.Vector3(); dir[ax] = -sgn;                    // from outside the face, inward

      for (const fu of [0.25, 0.5, 0.75]) for (const fv of [0.25, 0.5, 0.75]) {
        const o = c.clone(); o[u] = bb.min[u] + size[u] * fu; o[v] = bb.min[v] + size[v] * fv; o[ax] = (sgn > 0 ? bb.max[ax] : bb.min[ax]) + sgn * 0.5;

import { meshRules } from "../../src/make/mesh-rules.js";
let MANIFOLD = null;      // loaded the first time a kind is checked, never in play
window.__partsCheck = async (names = [...new Set(furniture1660.map(k => k.kind).concat(kinds().map(k => k.kind)))], { minSeen = 0.1 } = {}) => {
  if (!MANIFOLD) { const { default: Module } = await import("https://cdn.jsdelivr.net/npm/manifold-3d@3.5.4/manifold.js"); MANIFOLD = await Module(); MANIFOLD.setup(); }
  const out = [], times = [], ruleMs = [];

    const t = performance.now();
    let b, rec; try { ({ out: b, rec } = auditing(() => build(THREE, K, look, name, `check/${name}`))); } catch (e) { out.push({ kind: name, error: String(e) }); continue; }

    const triOf = (g, m) => { const q = g.index ? g.toNonIndexed() : g, pos = q.attributes.position, v = new THREE.Vector3(), a = new Float32Array(pos.count * 3);
      for (let i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i); if (m) v.applyMatrix4(m); a[i * 3] = v.x; a[i * 3 + 1] = v.y; a[i * 3 + 2] = v.z; } return a; };

      for (const r of rec) { let m = null;
        if (moved && r.mover) { const g = b.movers.get(r.mover); g.updateMatrix(); m = g.matrix.clone().multiply(new THREE.Matrix4().makeTranslation(-g.userData.home.position.x, -g.userData.home.position.y, -g.userData.home.position.z)); }
        const tr = triOf(r.g, m); (by.get(r.index) || by.set(r.index, []).get(r.index)).push({ tr, sheet: r.sheet }); }
      const cat = (arrs) => { const n = arrs.reduce((s, x) => s + x.length, 0), out = new Float32Array(n); let o = 0; for (const x of arrs) { out.set(x, o); o += x.length; } return out; };
