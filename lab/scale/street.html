<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>London Street Test</title>
<style>
  :root { --ink: #ece4d2; --dim: #a89e88; --panel: rgba(18, 15, 12, 0.78); --line: rgba(236, 228, 210, 0.2); }
  html, body { height: 100%; margin: 0; background: #0d0b09; color: var(--ink); overflow: hidden; font: 12px "IBM Plex Mono", ui-monospace, monospace; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; left: 12px; top: 12px; background: var(--panel); border: 1px solid var(--line); padding: 8px 12px; white-space: pre; line-height: 1.5; color: var(--dim); }
  #status { position: fixed; inset: 0; display: grid; place-items: center; background: #0d0b09; color: var(--dim); }
  #status[hidden], #hud[hidden] { display: none; }
  @media (max-width: 640px) { #hud { font-size: 10px; left: 8px; top: 8px; } }
</style>
</head>
<body>
<div id="status">framing the street…</div>
<div id="hud" hidden></div>
<script type="importmap">{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.min.js",
  "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.min.js",
  "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
  "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.js": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.min.js"
}}</script>
<script type="module">
// The London street c.1660 (R46's street package, src/make/street.js): 150 m of a main street of the City before the
// Fire, made from rules and a seed on a gently curving spine over gently rising ground, under a sun dimmed by sea-coal
// smoke. WASD walks it (the street's blocked() keeps you out of the houses and off the posts and stall boards; shift
// strides); the mouse looks (click first); thumbs on a phone.
// Test hooks: __eye(s, t, yaw, pitch) stands you on the street (s metres along the spine, t across, + to the left);
// __freeCam = [x, y, z, yaw, pitch] puts the camera anywhere (plan coordinates, degrees; yaw 0 looks north, 90 west,
// as on the manor page); __look(x, y, z, tx, ty, tz) aims a free camera at a point; __spin = true draws every frame;
// __stats() reports the frame, the draws and the build. ?seed=, ?width=, ?length=, ?dpr=, ?webgl=1, ?order=reverse.
import * as THREE from "three/webgpu";
import { makeRender } from "../../src/make/render.js";
import { makeStreet } from "../../src/make/street.js";
import { fbm, mm } from "../../src/make/noise.js";
import { touchControls, isTouch } from "../touch.js";

const Q = new URLSearchParams(location.search), num = (k, d) => Q.has(k) ? +Q.get(k) : d, T0 = performance.now(), mark = {};
const ENG = await makeRender({ outdoor: true }), renderer = ENG.renderer; mark.renderer = performance.now() - T0;
// the spine: 150 m turning gently left, a little more in its middle (an old street keeps to its old property lines),
// points every 2 m in whole millimetres; the land rising gently eastward with a little roll in it
const LEN = num("length", 150), spine = [];
{ let x = 0, y = 0, a = -0.25; for (let s = 0; s <= LEN + 1e-6; s += 2) { spine.push([Math.round(x * 1000) / 1000, Math.round(y * 1000) / 1000]); a += 0.0042 * (1 + 0.8 * Math.sin(Math.PI * s / LEN)); x += Math.cos(a) * 2; y += Math.sin(a) * 2; } }
const ground = (x, y) => mm(0.016 * x + 0.45 * fbm(x, y, { cell: 70, octaves: 2, seed: 166 })) / 1000;
const street = makeStreet(THREE, { spine, width: num("width", 10), seed: num("seed", 1660), ground, order: Q.get("order") || undefined });
mark.street = street.ms; window.__street = street;
const scene = new THREE.Scene(); scene.add(street.group); window.__scene = scene;

// the air: sea-coal haze (§B2, Evelyn's Fumifugium, 1661), brown-grey toward the horizon; a sky dome that goes with you
const HAZE = new THREE.Color(0xaba391); scene.background = HAZE; scene.fog = new THREE.Fog(HAZE, 30, 300);
const camera = new THREE.PerspectiveCamera(66, innerWidth / innerHeight, 0.05, 3000);
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
{ const sg = new THREE.SphereGeometry(2400, 32, 16), col = [], top = new THREE.Color(0x949ea6), hor = new THREE.Color(0xbfb6a3), c = new THREE.Color();
  for (let i = 0; i < sg.attributes.position.count; i++) { const y = sg.attributes.position.getY(i) / 2400; c.copy(hor).lerp(top, Math.max(0, Math.min(1, y * 1.5))); col.push(c.r, c.g, c.b); }
  sg.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  const sky = new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false })); sky.renderOrder = -1; sky.frustumCulled = false;
  sky.onBeforeRender = () => sky.position.copy(camera.position); scene.add(sky); }
// the land beyond the street's paving: earth and trodden mud, following the same height function a little lower
{ const N = 180, S = 2.5, g = new THREE.PlaneGeometry(N * S, N * S, N, N); g.rotateX(-Math.PI / 2); const cx = 70, cy = 20; g.translate(cx, 0, -cy);
  const p = g.attributes.position, col = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = -p.getZ(i); p.setY(i, ground(x, y) - 0.09); const k = 0.75 + 0.25 * fbm(x, y, { cell: 9, octaves: 2, seed: 9 }); col.set([0.2 * k, 0.17 * k, 0.12 * k], i * 3); }
  g.setAttribute("color", new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 })); m.receiveShadow = true; m.name = "land"; scene.add(m); }
// light: a sun from the south-west, its shadow box going with you (drawn again only when it moves), and the sky's fill
const sun = new THREE.DirectionalLight(0xffdfb6, 2.4); sun.castShadow = true; const SM = ENG.phone ? 2048 : 4096; sun.shadow.mapSize.set(SM, SM);
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04; Object.assign(sun.shadow.camera, { left: -75, right: 75, top: 75, bottom: -75, near: 1, far: 400 }); sun.shadow.autoUpdate = false;
const SUN = new THREE.Vector3(-0.52, 0.66, 0.54).normalize();
scene.add(sun, sun.target, new THREE.HemisphereLight(0xc6cbd2, 0x5a4a38, 0.9));
let shadowAt = null;
function placeSun(x, y) { const k = 25, sx = Math.round(x / k) * k, sy = Math.round(y / k) * k; if (shadowAt && shadowAt[0] === sx && shadowAt[1] === sy) return false;
  shadowAt = [sx, sy]; const z = ground(sx, sy); sun.target.position.set(sx, z, -sy); sun.position.set(sx + SUN.x * 200, z + SUN.y * 200, -sy + SUN.z * 200); sun.target.updateMatrixWorld(); sun.shadow.needsUpdate = true; return true; }

// walking: on the street's height, kept out of what is solid by the street's blocked()
const TOUCH = isTouch(), EYE = 1.6, keys = {};
let { x: px, y: py, yaw: y0 } = street.frame(num("s", 14), num("t", -0.8)), ph = street.heightAt(px, py), yaw = num("yaw", y0) * Math.PI / 180, pitch = 0.03;
addEventListener("keydown", e => { keys[e.code] = true; if (e.code === "Backslash") $hud.hidden = !$hud.hidden; });
addEventListener("keyup", e => { keys[e.code] = false; });
renderer.domElement.addEventListener("click", () => { try { renderer.domElement.requestPointerLock()?.catch?.(() => {}); } catch (_) {} });
addEventListener("mousemove", e => { if (document.pointerLockElement === renderer.domElement) { yaw -= e.movementX * 0.0022; pitch = Math.max(-1.35, Math.min(1.35, pitch - e.movementY * 0.0022)); } });
const touch = TOUCH ? touchControls(renderer.domElement, { onLook: (dx, dy) => { yaw -= dx * 0.004; pitch = Math.max(-1.3, Math.min(1.3, pitch - dy * 0.004)); } }) : { active: false, stick: { x: 0, y: 0 } };
window.__eye = (s, t, yd, pd = 2) => { window.__freeCam = null; const f = street.frame(s, t); px = f.x; py = f.y; ph = street.heightAt(px, py); yaw = (yd ?? f.yaw) * Math.PI / 180; pitch = pd * Math.PI / 180; };
window.__look = (x, y, z, tx, ty, tz) => { window.__freeCam = [x, y, z, Math.atan2(-(tx - x), ty - y) * 180 / Math.PI, Math.atan2(tz - z, Math.hypot(tx - x, ty - y)) * 180 / Math.PI]; };
const step = (x, y, h) => { if (street.blocked(x, y, 0.22)) return null; const z = street.heightAt(x, y); return Math.abs(z - h) > 0.45 ? null : z; };
// a test's walk: from (x0, y0) toward (x1, y1) in 5 cm steps with the walker's rules; where it stopped
window.__walk = (x0, y0, x1, y1) => { let x = x0, y = y0, h = street.heightAt(x0, y0); const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 0.05);
  for (let i = 1; i <= n; i++) { const nx = x0 + (x1 - x0) * i / n, ny = y0 + (y1 - y0) * i / n, g = step(nx, ny, h); if (g == null) return { x: +x.toFixed(2), y: +y.toFixed(2), done: false, steps: i - 1, walked: +(Math.hypot(x - x0, y - y0)).toFixed(2) }; x = nx; y = ny; h = g; }
  return { x: +x.toFixed(2), y: +y.toFixed(2), done: true, steps: n, walked: +(Math.hypot(x - x0, y - y0)).toFixed(2) }; };

const $hud = document.getElementById("hud"); $hud.hidden = false;
let frames = 0, since = performance.now(), fps = 0, last = performance.now(), info = { calls: 0, tris: 0 };
window.__stats = () => ({ backend: ENG.backend, fps, calls: info.calls, tris: info.tris, ratio: +renderer.getPixelRatio().toFixed(2), street: street.stats, digest: street.digest(), marks: Object.fromEntries(Object.entries(mark).map(([k, v]) => [k, Math.round(v)])) });
const s0 = street.stats;
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  const sp = (keys.ShiftLeft || keys.ShiftRight ? 2.8 : 1.4) * dt, fx = -Math.sin(yaw), fy = Math.cos(yaw), rx = Math.cos(yaw), ry = Math.sin(yaw);
  let dx = 0, dy = 0;
  if (keys.KeyW || keys.ArrowUp) { dx += fx; dy += fy; } if (keys.KeyS || keys.ArrowDown) { dx -= fx; dy -= fy; }
  if (keys.KeyD || keys.ArrowRight) { dx += rx; dy += ry; } if (keys.KeyA || keys.ArrowLeft) { dx -= rx; dy -= ry; }
  if (touch.active) { dx += fx * -touch.stick.y + rx * touch.stick.x; dy += fy * -touch.stick.y + ry * touch.stick.x; }
  const n = Math.hypot(dx, dy), free = window.__freeCam;
  if (n && !free) { dx = dx / n * Math.min(1, n) * sp; dy = dy / n * Math.min(1, n) * sp; let g = step(px + dx, py, ph); if (g != null) { px += dx; ph = g; } g = step(px, py + dy, ph); if (g != null) { py += dy; ph = g; } }
  const before = camera.position.clone(), rot = camera.rotation.clone();
  if (free) { camera.position.set(free[0], free[2], -free[1]); camera.rotation.set(free[4] * Math.PI / 180, free[3] * Math.PI / 180, 0, "YXZ"); }
  else { camera.position.set(px, ph + EYE, -py); camera.rotation.set(pitch, yaw, 0, "YXZ"); }
  const moved = !before.equals(camera.position) || !rot.equals(camera.rotation), first = !window.__ok;
  const shadowMoved = placeSun(camera.position.x, -camera.position.z);
  if (ENG.frame(scene, camera, { changed: moved || first || shadowMoved || !!window.__spin })) { info = { calls: renderer.info.render.drawCalls, tris: renderer.info.render.triangles }; frames++; }
  if (now - since > 500) { fps = Math.round(frames * 1000 / (now - since)); frames = 0; since = now;
    $hud.textContent = `${ENG.backend} · ${fps} fps drawn · ${info.calls} draws · ${(info.tris / 1e6).toFixed(2)}M tris\n${s0.lots} lots (${s0.inns} inns, ${s0.lanes} lanes, ${s0.entries} entries) · ${s0.signs} signs · ${s0.posts} posts\nbuilt in ${s0.ms.total} ms (plan ${s0.ms.plan}, textures ${s0.ms.textures}, geometry ${s0.ms.geometry}) · ${s0.meshes} meshes\nWASD walk, shift stride, click to look · \\ hides this`; }
  if (first) { window.__ok = true; mark.first = performance.now() - T0; document.getElementById("status").hidden = true; }
});
</script>
</body>
</html>
