<!doctype html>

</head>
<body>

<div id="status">raising the street…</div>

<script type="module">
// The light bench (R50, the fps lab; Kabe, 2026-10-11: "London street at night, extra long each window having an internal
// light source and street lamps going down is a good test. Have MANY light sources, lock in high fidelity for all, consider
// cheapest approximation render for all, compare quality overall against each other, then where the quality cutoff in

// every door. Each source shows itself the same way in every mode (the glass glows, a lantern's flame and halo), so the
// modes differ only in the light each casts:

//   ?mode=grid    every source's light summed at generation into a probe grid (three's LightProbeGrid, its spherical
//                 harmonics filled from the lights by arithmetic, no bake): one lookup a pixel, however many lights
//   ?mode=hybrid  real lights within ?r= metres of you, the grid for the rest (the grid made again when you have gone r/4)
//   ?mode=none    the moon and the sky alone

// lights) measured as on the street"): beyond ?castfar= metres (1500) a source casts nothing, and the grid fills in as you
// come within it; a window or lantern smaller than a few pixels is drawn as a point of the same light, never under
// ?pmin= pixels (1.5) and as bright in all, fading to the glass itself between ?p0= and ?p1= metres (1000, 1500) (?points=0 never,
// 1 always). The hour (Kabe: "a moon and sun that we can dynamically switch between times of day"): ?hour= (22), the slider,
// [ and ]: one set of values for the whole look (sun or moon as the one key light, sky, fog, exposure, the lamps lit).
// ?length= (m), ?gs= the grid's spacing (m), ?exposure=, ?dpr=. Test hooks: __eye(s, t, yaw, pitch), __at(x, y, z, yaw,
// pitch) (three's coordinates, degrees), __hour(h), __spin, __gpu(), __stats(), __depth(on) (each pixel's distance from
// the eye as grey, 1 = 256 m), __hybrid(r).

const Q = new URLSearchParams(location.search), num = (k, d) => Q.has(k) ? +Q.get(k) : d, T0 = performance.now(), mark = {};
const MODE = Q.get("mode") || "hybrid", LEN = num("length", 400), GS = num("gs", 1);
let R = num("r", 20);

const BACKEND = renderer.backend.isWebGPUBackend ? "webgpu" : "webgl";

const pxAngleU = uniform(0);       // a pixel's width in radians (for the far points)
const fitPx = () => { pxAngleU.value = 2 * Math.tan(camera.fov * Math.PI / 360) / (innerHeight * renderer.getPixelRatio()); }; fitPx();

}

// is big. Lanterns: the street's own, one by each door.

const lanterns = sources.filter(s => s.kind === "lantern"), windows = sources.filter(s => s.kind === "window");

// how each shows itself, the same in every mode: the glass glowing from within; a lantern's flame (its halo, a sphere, read
// as a grey disc: dropped; far off, the points below carry it)
// (the far points take a window's glow over between P0 and P1 metres: glass and point never both full)
