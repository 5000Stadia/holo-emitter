  if (depthOn) { scene.overrideMaterial = null; scene.fog = new THREE.Fog(NIGHT, 35, 240); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace; }
  if (renderer.backend.trackTimestamp && !gpuBusy) { gpuBusy = true; renderer.resolveTimestampsAsync("render").then(v => { if (v > 0) { gpuMs.push(v); if (gpuMs.length > 240) gpuMs.shift(); } }).catch(() => {}).finally(() => { gpuBusy = false; }); }
  frames++; if (now - since > 500) { fps = Math.round(frames * 1000 / (now - since)); frames = 0; since = now;
    $hud.textContent = `${BACKEND} · ${MODE}${MODE === "hybrid" ? ` r ${R} m` : ""} · ${fps} fps · GPU ${__gpu() ?? "–"} ms\n${windows.length} windows · ${lanterns.length} lanterns · ${pool.filter(l => l.intensity > 0).length} of ${POOL} real lights on\ngrid ${res.x}×${res.y}×${res.z} (${(gridData.byteLength / 1048576).toFixed(1)} MB) filled in ${gridMs} ms`; }
  if (!window.__ok) { window.__ok = true; mark.first = Math.round(performance.now() - T0); document.getElementById("status").hidden = true; document.getElementById("hud").hidden = false; }
});
</script>
