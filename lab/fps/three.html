  pose(0);
  const cpu = []; let drawn = 0, nextTick = performance.now(), lastDraw = -1e9, dirty = true;
  const t0 = performance.now(); timing = false;
  await new Promise(done => renderer.setAnimationLoop(() => {
    const now = performance.now();
    if (now < nextTick) return; nextTick += 1000 / 60; if (now - nextTick > 100) nextTick = now;     // one display tick
    const el = now - t0, measuring = el > spec.warmup_seconds * 1000;
    if (measuring && !timing) { timing = true; drawn = 0; cpu.length = 0; gpuMs.length = 0; }
    let want = dirty || C.still === "every";
    if (C.still.startsWith("flicker")) { fire.intensity = 30 * (0.8 + 0.2 * Math.sin(now * 0.023) * Math.sin(now * 0.0071)); want = C.still === "flicker60" || now - lastDraw >= 62.5; }
    if (want) { const c0 = performance.now(); draw(); cpu.push(performance.now() - c0); timeGpu(); drawn++; lastDraw = now; dirty = false; }
    if (el > total) { renderer.setAnimationLoop(null); done(); }
  }));
  const perS = drawn / spec.seconds, c = med(cpu), g = med(gpuMs);
  window.__result = { engine: backend, case: cs.id, still: C.still, fps: +perS.toFixed(1), drawn_per_s: +perS.toFixed(1), cpu_ms: c, gpu_ms: g,
    busy_ms_per_s: +(perS * ((g ?? 0) + (c ?? 0))).toFixed(1), depth: depthGot, buffer: [renderer.domElement.width, renderer.domElement.height] };
  $(JSON.stringify(window.__result, null, 1));
  await new Promise(() => {});
}

// the run: the camera orbits the scene; frames are timed after the warm-up
const times = [], t0 = performance.now(); let last = t0, frames = 0, firstFrame = null;
await new Promise(done => renderer.setAnimationLoop(() => {
  const now = performance.now(), el = (now - t0) / 1000;
  pose(el);
  if (physics) {
    // a fixed 60 Hz step, as Godot's physics runs, so both engines do the same work per second
    physics.acc = Math.min(4 / 60, (physics.acc || 0) + (now - last) / 1000);
    while (physics.acc >= 1 / 60) { const p0 = performance.now(); physics.world.step(); physics.ms.push(performance.now() - p0); physics.acc -= 1 / 60; }
    physics.bodies.forEach((b, i) => { const t = b.translation(), r = b.rotation(); boxes.setMatrixAt(i, m4.compose(v.set(t.x, t.y, t.z), q.set(r.x, r.y, r.z, r.w), sc.set(1, 1, 1))); });
    boxes.instanceMatrix.needsUpdate = true;
  }
  const c0 = performance.now(); draw(); if (firstFrame == null) firstFrame = performance.now() - c0;
  if (now - t0 > spec.warmup_seconds * 1000) times.push(now - last);
  last = now; frames++;
  if (frames % 30 === 0) $(`${backend} · ${cs.id} · ${Math.round(1000 / (times.slice(-30).reduce((x, y) => x + y, 0) / Math.max(1, Math.min(30, times.length))))} fps`);
  if (now - t0 > total) { renderer.setAnimationLoop(null); done(); }
}));
// GPU ms, after the timed run and apart from it: 40 frames over the same orbit, each drawn alone and its timestamps
// awaited before the next (timestamps read while frames run back to back went unresolved at the phone's size)
const info = { draws: renderer.info.render.drawCalls, triangles: renderer.info.render.triangles };     // the timed run's last frame
if (renderer.backend.trackTimestamp) {
  try { await renderer.resolveTimestampsAsync("render"); } catch (_) {}
  for (let i = 0; i < 40; i++) { pose(spec.warmup_seconds + i * spec.seconds / 40); draw();
    try { const g = await renderer.resolveTimestampsAsync("render"); if (g > 0) gpuMs.push(g); } catch (_) {} }
}
const sorted = [...times].sort((a, b) => a - b), mean = times.reduce((a, b) => a + b, 0) / times.length;
window.__result = { engine: backend, case: cs.id, fps: Math.round(1000 / mean * 10) / 10, mean_ms: +mean.toFixed(2), p99_ms: +sorted[Math.floor(sorted.length * 0.99)].toFixed(2), frames: times.length,
  draws: info.draws, triangles: info.triangles, physics_ms: physics ? +(physics.ms.reduce((a, b) => a + b, 0) / physics.ms.length).toFixed(2) : null,
  // tonight's measures: GPU ms a frame (median), the first frame's CPU ms (compiles, texture uploads), texture bytes, the depth got
  gpu_ms: med(gpuMs), first_frame_ms: firstFrame == null ? null : +firstFrame.toFixed(1), depth: depthGot, buffer: [renderer.domElement.width, renderer.domElement.height],
  ...(texSet ? { tex_gpu_mb: +(tex.bytes_gpu / 1048576).toFixed(1), tex_cpu_mb: +(tex.bytes_cpu / 1048576).toFixed(1), tex_gen_ms: tex.gen_ms } : {}) };
$(JSON.stringify(window.__result, null, 1));
