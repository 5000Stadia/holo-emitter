<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><script src="../../src/make/assets.js?v=f71a75dc"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Manor, From Its Plan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root { --ink: #ece4d2; --ink-dim: #a89e88; --panel: rgba(22, 19, 16, 0.72); --line: rgba(236, 228, 210, 0.2); --brass: #c9a961; }
  html, body { height: 100%; margin: 0; background: #0c0a08; color: var(--ink); overflow: hidden; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 13px; }
  canvas { display: block; }
  .hud { position: fixed; inset: 0; pointer-events: none; display: grid; grid-template-rows: auto 1fr auto; padding: 18px; gap: 12px; }
  .top, .bottom { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .bottom { align-items: flex-end; }
  .box { background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; color: var(--ink-dim); line-height: 1.6; }
  .room .eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
  .room .name { font-family: "Josefin Sans", sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px; color: var(--brass); }
  kbd { font-family: inherit; color: var(--ink); border: 1px solid var(--line); padding: 0 5px; border-radius: 2px; }
  #gate { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); cursor: pointer; z-index: 2; border: 1px solid var(--brass); padding: 12px 22px; background: var(--panel); text-align: center; }
  #gate .t { font-family: "Josefin Sans", sans-serif; font-weight: 300; font-size: 20px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--brass); }
  #gate[hidden], #status[hidden] { display: none !important; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; background: #0c0a08; z-index: 3; text-align: center; padding: 24px; }
  #status .t { font-family: "Josefin Sans", sans-serif; font-weight: 300; font-size: 26px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--brass); }
  @media (max-width: 640px), (pointer: coarse) { .hud { padding: 10px; font-size: 11px; } .stats { display: none; } }
</style>
</head>
<body>
<div id="status"><div><div class="t">The Manor</div><div id="statusText" style="margin-top:12px;color:var(--ink-dim)">loading…</div></div></div>
<div id="gate" tabindex="0"><div class="t">click to walk</div><div style="color:var(--ink-dim)">esc releases the mouse · or drag to look</div></div>
<div class="hud">
  <div class="top">
    <div class="box room"><div class="eyebrow" id="floorName">you are in</div><div class="name" id="roomName">—</div></div>
    <div class="box stats" id="stats"></div>
  </div>
  <div></div>
  <div class="bottom"><div class="box"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk &nbsp; mouse look &nbsp; <kbd>shift</kbd> stride &nbsp; walk into a stair to climb it &nbsp; click or <kbd>E</kbd> opens or shuts a door</div></div>
</div>
<script>window.addEventListener("error", (e) => { if (!window.__ok) document.getElementById("statusText").textContent = "error: " + (e.message || e.type); });</script>
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { RectAreaLightUniformsLib } from "three/addons/lights/RectAreaLightUniformsLib.js";
import { buildHouse } from "./house.js";
import { generatePlan } from "./plan-gen.js";
import { touchControls, isTouch, fullscreenButton } from "../touch.js";
fullscreenButton();

const Q = new URLSearchParams(location.search);
const statusText = document.getElementById("statusText");
const tLoad = performance.now();
// the plan: packs/manor's, exactly as the painted pipeline reads it (tools/pack.mjs), baked to plan.json
// ?plan=grand builds a generated manor (plan-gen.js: ?seed, ?length, ?wing, ?floors); otherwise the manor pack's
const plan = Q.get("plan") === "grand"
  ? generatePlan({ seed: +(Q.get("seed") || 1660), length: +(Q.get("length") || 64), wing: +(Q.get("wing") || 24), floors: +(Q.get("floors") || 3) })
  : await (await fetch("./plan.json")).json();
const tPlan = performance.now();
window.__plan = plan;
RectAreaLightUniformsLib.init();
const renderer = new THREE.WebGLRenderer({ antialias: true });
// ?lite=1 for a modest machine: pixel ratio 1, no ambient-occlusion pass, a smaller sun shadow
const TOUCH = isTouch();
const LITE = Q.get("lite") === "1" || (TOUCH && Q.get("lite") !== "0");      // phones get the light mode unless ?lite=0
renderer.setPixelRatio(LITE ? 1 : Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const camera = new THREE.PerspectiveCamera(66, innerWidth / innerHeight, 0.03, 120);
const startId = Q.get("room") || plan.entrance || "great_hall";
// ?near=999 builds every room before the first frame (a clean measure of the whole build); the default
// builds the rooms within 14 m of where you start, then streams the rest in behind you
const house = await buildHouse(plan, (what) => { statusText.textContent = what + "…"; }, { startId, nearFirst: +(Q.get("near") || 14) });
const { scene, rooms, rig, level } = house;
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(innerWidth * renderer.getPixelRatio(), innerHeight * renderer.getPixelRatio(), { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
gtao.updateGtaoMaterial({ radius: 0.5, distanceExponent: 1.6, thickness: 1.5, scale: 1.5, samples: 16 });
if (!LITE) composer.addPass(gtao);
composer.addPass(new OutputPass());
if (LITE) scene.traverse(o => { if (o.isDirectionalLight) { o.shadow.mapSize.set(2048, 2048); } });

// where you can stand: any room of your floor (a hand's breadth off its walls), any doorway, any stair
const LEVEL_GAP = 3.1, EYE = 1.6;
const inRect = (r, x, y, m = 0) => x > r.x0 + m && x < r.x1 - m && y > r.y0 + m && y < r.y1 - m;
const levelOf = (f) => plan.floors.find(q => q.id === f).level * LEVEL_GAP;
const floorsUp = [...plan.floors].sort((a, b) => a.level - b.level);
const floorOf = (h) => { let f = floorsUp[0].id; for (const q of floorsUp) if (q.level * LEVEL_GAP <= h + 1.2) f = q.id; return f; };
const stairAt = (x, y, h) => plan.stairs.find(s => inRect(s.rect, x, y) && [house.stairFrom(s), house.stairTo(s)].includes(floorOf(h)));
const stairHeight = (s, x, y) => { const R = s.rect; const t = s.up === "N" ? (y - R.y0) / (R.y1 - R.y0) : s.up === "S" ? (R.y1 - y) / (R.y1 - R.y0) : s.up === "E" ? (x - R.x0) / (R.x1 - R.x0) : (R.x1 - x) / (R.x1 - R.x0);
  const b = levelOf(house.stairFrom(s)); return b + Math.max(0, Math.min(1, t)) * (levelOf(house.stairTo(s)) - b); };
const doorOf = (id) => house.doors.find(d => d.id === id);
// the walkable strip through an opening: its width less a hand at each jamb, and 0.35 m into each room
// (rooms keep you 0.2 m off their walls, so the strip must overlap that margin, not stop short of it)
const passage = (R) => (R.x1 - R.x0) < (R.y1 - R.y0)
  ? { x0: R.x0 - 0.35, x1: R.x1 + 0.35, y0: R.y0 + 0.08, y1: R.y1 - 0.08 }
  : { x0: R.x0 + 0.08, x1: R.x1 - 0.08, y0: R.y0 - 0.35, y1: R.y1 + 0.35 };
// a test hook: walk in a straight line in 5 cm steps under the same rules; returns where you stopped
window.__doorState = (id) => { const d = doorOf(id); return d ? { angle: d.angle, target: d.target } : null; };
window.__walk = (x0, y0, x1, y1, floor = null) => {
  let x = x0, y = y0; const h = floor ? levelOf(floor) : ph, n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 0.05);
  for (let i = 1; i <= n; i++) { const nx = x0 + (x1 - x0) * i / n, ny = y0 + (y1 - y0) * i / n; if (!standable(nx, ny, h)) return { x, y, done: false }; x = nx; y = ny; }
  return { x, y, done: true };
};
function standable(x, y, h) {
  const f = floorOf(h);
  if (stairAt(x, y, h)) return true;
  if (plan.rooms.some(r => r.floor === f && inRect(r.rect, x, y, 0.2))) return true;
  return plan.openings.some(o => o.floor === f && o.rect && inRect(passage(o.rect), x, y)
    && (!doorOf(o.id) || doorOf(o.id).angle > 0.8));                 // a shut door is a wall
}
const roomAt = (x, y, h) => rooms.find(r => r.room.floor === floorOf(h) && inRect(r.room.rect, x, y));

const start = plan.rooms.find(r => r.id === startId) || plan.rooms[0];
let px = Q.get("x") ? +Q.get("x") : (start.rect.x0 + start.rect.x1) / 2, py = Q.get("y") ? +Q.get("y") : (start.rect.y0 + start.rect.y1) / 2;
let ph = levelOf(start.floor), yaw = (+Q.get("yaw") || 0) * Math.PI / 180, pitch = (+Q.get("pitch") || 0) * Math.PI / 180;
window.__place = (x, y, yd, pd = 0, floor = null) => { px = x; py = y; yaw = yd * Math.PI / 180; pitch = pd * Math.PI / 180; if (floor) ph = levelOf(floor === "upper" && !plan.floors.some(q => q.id === "upper") ? "first" : floor); };

const keys = {};
const ray = new THREE.Raycaster(); ray.far = 2.6;
function toggleDoor(ndc) {
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(house.doors.filter(d => d.holder.visible).map(d => d.leaf), false)[0];
  let d = hit ? doorOf(hit.object.userData.door) : null;
  if (!d) { let best = 2.0; for (const q of house.doors) { const c = { x: (q.rect.x0 + q.rect.x1) / 2, y: (q.rect.y0 + q.rect.y1) / 2 }; const dd = Math.hypot(c.x - px, c.y - py); if (q.floor === floorOf(ph) && dd < best) { best = dd; d = q; } } }
  if (d) d.target = d.target > 0.8 ? 0 : 1.62;
}
addEventListener("keydown", e => { keys[e.code] = true; if (e.code === "KeyE") toggleDoor(new THREE.Vector2(0, 0)); });
addEventListener("keyup", e => { keys[e.code] = false; });
const gate = document.getElementById("gate");
const lock = () => { try { const p = renderer.domElement.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (_) {} };
gate.addEventListener("click", lock);
document.addEventListener("pointerlockchange", () => { gate.hidden = document.pointerLockElement === renderer.domElement; });
const look = (mx, my) => { yaw -= mx * 0.0022; pitch -= my * 0.0022; pitch = Math.max(-1.4, Math.min(1.4, pitch)); };
document.addEventListener("mousemove", e => { if (document.pointerLockElement === renderer.domElement) look(e.movementX, e.movementY); });
let drag = null;
renderer.domElement.addEventListener("pointerdown", e => { if (e.pointerType === "touch") return; if (document.pointerLockElement === renderer.domElement) { toggleDoor(new THREE.Vector2(0, 0)); return; } drag = { x: e.clientX, y: e.clientY }; if (e.pointerType === "mouse") lock(); });
// phones and tablets: left thumb walks, right thumb looks, a tap opens or shuts the door under it
const touch = touchControls(renderer.domElement, { onLook: (dx, dy) => look(dx, dy), onTap: (x, y) => toggleDoor(new THREE.Vector2(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1)) });
if (TOUCH) {
  gate.hidden = true;
  document.querySelector(".bottom .box").innerHTML = "left thumb walks &nbsp; right thumb looks &nbsp; tap a door to open or shut it";
}
renderer.domElement.addEventListener("pointermove", e => { if (drag && document.pointerLockElement !== renderer.domElement) { look((e.clientX - drag.x) * 1.6, (e.clientY - drag.y) * 1.6); drag = { x: e.clientX, y: e.clientY }; } });
addEventListener("pointerup", () => { drag = null; });
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });

const st = house.stats;
st.first_frame_ms = null;
const statsEl = document.getElementById("stats");
const showStats = () => { statsEl.innerHTML = `walking in <b>${(st.first_ready_ms / 1000).toFixed(1)} s</b> (${st.rooms_first} rooms)` + (st.all_rooms_ms ? `<br>whole house <b>${(st.all_rooms_ms / 1000).toFixed(1)} s</b> · ${st.rooms} rooms` : `<br>building the rest…`) + `<br>${st.windows} windows · ${st.doors} doors${st.desks !== undefined ? ` · ${st.desks} desks` : ""}`; };
showStats(); house.rest.then(showStats);
window.__stats = st;
// time an edit: rebuild one room, e.g. with its windows made taller, and draw it
window.__rebuild = async (id) => {
  const ms = await house.rebuildRoom(id, (spec) => { for (const F of "NESW") for (const e of spec.walls[F]) if (e.kind === "window") e.top = Math.min(spec.H - 0.2, e.top + 0.15); return spec; });
  const t = performance.now(); composer.render(); const draw = Math.round(performance.now() - t);
  if (cur && cur.room.id === id) rig(house.rooms.find(r => r.room.id === id));
  return { rebuild_ms: ms, first_draw_ms: draw };
};
const roomName = document.getElementById("roomName"), floorName = document.getElementById("floorName");
let last = performance.now(), cur = null, cullT = 0, cullN = -1, shown = 0;
renderer.info.autoReset = false;
// the performance panel: frame rate, frame time, draw calls, triangles, rooms built and drawn, memory
const perfEl = document.createElement("div"); perfEl.className = "box";
perfEl.style.cssText = isTouch() ? "position:fixed;left:10px;bottom:74px;font-size:10px;line-height:1.4;padding:4px 8px;pointer-events:none;white-space:nowrap"
                                 : "position:fixed;right:18px;bottom:18px;font-size:12px;line-height:1.55;pointer-events:none";
document.body.appendChild(perfEl);
const fr = []; let perfT = 0;
window.__perf = {};
function perf(now) {
  fr.push(now); while (fr.length && now - fr[0] > 2000) fr.shift();
  if (now - perfT < 500) return; perfT = now;
  const fps = fr.length > 1 ? (fr.length - 1) / ((fr[fr.length - 1] - fr[0]) / 1000) : 0;
  const mem = performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) : null;
  Object.assign(window.__perf, { fps: +fps.toFixed(1), calls: renderer.info.render.calls, tris: renderer.info.render.triangles, built: house.rooms.length, of: plan.rooms.length, drawn: shown, heapMB: mem, geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures });
  perfEl.innerHTML = `<b>${fps.toFixed(0)}</b> fps · ${renderer.info.render.calls} draws · ${(renderer.info.render.triangles / 1000).toFixed(0)}k tris<br>rooms built ${house.rooms.length}/${plan.rooms.length} · drawn ${shown}${mem ? ` · heap ${mem} MB` : ""}`;
}
function step(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const speed = (keys.ShiftLeft || keys.ShiftRight) ? 3.0 : 1.5;
  const fx = -Math.sin(yaw), fy = Math.cos(yaw), rx = Math.cos(yaw), ry = Math.sin(yaw);
  let dx = 0, dy = 0;
  if (keys.KeyW || keys.ArrowUp) { dx += fx; dy += fy; }
  if (keys.KeyS || keys.ArrowDown) { dx -= fx; dy -= fy; }
  if (keys.KeyD || keys.ArrowRight) { dx += rx; dy += ry; }
  if (keys.KeyA || keys.ArrowLeft) { dx -= rx; dy -= ry; }
  if (touch.active) { dx += fx * -touch.stick.y + rx * touch.stick.x; dy += fy * -touch.stick.y + ry * touch.stick.x; }
  const n = Math.hypot(dx, dy);
  if (n > 0) {
    const amt = Math.min(1, n);                           // a stick pushed halfway walks at half pace
    dx = dx / n * amt * speed * dt; dy = dy / n * amt * speed * dt;
    if (standable(px + dx, py, ph)) px += dx;
    if (standable(px, py + dy, ph)) py += dy;
  }
  const s = stairAt(px, py, ph);
  if (s) ph = stairHeight(s, px, py);
  for (const d of house.doors) if (d.angle !== d.target) { d.angle += Math.sign(d.target - d.angle) * Math.min(Math.abs(d.target - d.angle), dt * 3); d.pivot.rotation.y = -d.angle; }
  if (now - cullT > 250 || house.rooms.length !== cullN) { cullT = now; cullN = house.rooms.length; shown = house.cull(px, py, floorOf(ph)); }   // real time, not frame time
  const r = roomAt(px, py, ph);
  if (r && r !== cur) { cur = r; rig(r); roomName.textContent = r.room.name; floorName.textContent = ({ ground: "ground floor", upper: "upper floor", first: "first floor", second: "second floor" }[r.room.floor] || r.room.floor) + " · you are in"; }
  camera.position.set(px, ph + EYE, -py);
  camera.rotation.set(pitch, yaw, 0, "YXZ");
  renderer.info.reset(); composer.render();
  perf(now);
  if (!window.__ok) { window.__ok = true; st.first_frame_ms = Math.round(performance.now() - tLoad); document.getElementById("status").hidden = true; }
  requestAnimationFrame(step);
}
requestAnimationFrame(step);
</script>
</body>
