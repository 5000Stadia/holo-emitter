<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sitters</title>
<style>
  :root { --ink: #ece4d2; --dim: #a89e88; --brass: #c9a35c; }
  body { margin: 0; padding: 16px; background: #0d0b09; color: var(--ink); font: 14px/1.4 Georgia, serif; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; }
  figure { margin: 0; } figcaption { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .big canvas { width: 256px; height: 320px; display: block; }
  .small { display: flex; gap: 24px; margin: 18px 0; align-items: center; }
  .port { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--brass); overflow: hidden; background: #0d0b09; }
  .bare canvas { width: 192px; height: 240px; display: block; }
  .bare.grey { background: #7c7c7c; } .bare.wood { background: linear-gradient(90deg, #3b2616, #4a311d 30%, #36220f 60%, #4d3420); }
  .port canvas { width: 48px; height: 48px; display: block; }
  #ms { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div class="row big" id="big"></div>
<div class="small" id="small"></div>
<div class="small" id="face"></div>
<div class="row" id="bare"></div>
<div id="ms"></div>
<script type="module">
  import { paintSitter } from "../../src/make/sitter.js";
  const looks = Object.fromEntries((await (await fetch("./case-1660.json", { cache: "no-store" })).json()).cast.map((c) => [c.id, c.look]));
  const q = new URLSearchParams(location.search), full = q.has("full");
  const times = [];
  for (const [id, look] of Object.entries(looks)) {
    const t0 = performance.now(); const cv = paintSitter(look, { seed: id.length * 7919 }); times.push([id, performance.now() - t0]);
    const f = document.createElement("figure"); if (full) { cv.style.width = "512px"; cv.style.height = "640px"; } f.append(cv); const c = document.createElement("figcaption"); c.textContent = `${id}, ${look.age}`; f.append(c); document.getElementById("big").append(f);
    // as the talk panel crops it today: a square from 20% down, into a 48px round
    const p = document.createElement("div"); p.className = "port"; const s = document.createElement("canvas"); s.width = s.height = 96; const g = s.getContext("2d");
    const side = Math.min(cv.width, cv.height); g.drawImage(cv, (cv.width - side) / 2, (cv.height - side) * 0.2, side, side, 0, 0, 96, 96); p.append(s); document.getElementById("small").append(p);
    // cropped on the face (canvas.face), for comparison
    const p2 = document.createElement("div"); p2.className = "port"; const s2 = document.createElement("canvas"); s2.width = s2.height = 96; const g2 = s2.getContext("2d");
    const { x, y, r } = cv.face; g2.drawImage(cv, x - r, y - r, r * 2, r * 2, 0, 0, 96, 96); p2.append(s2); document.getElementById("face").append(p2);
  }
  // with nothing behind (ground: false), as the projection lays it over the room: on mid-grey and on dark wood
  for (const [id, look] of Object.entries(looks)) for (const bg of ["grey", "wood"]) {
    const cv = paintSitter(look, { seed: id.length * 7919, ground: false }); const f = document.createElement("figure"); f.className = `bare ${bg}`; f.append(cv); document.getElementById("bare").append(f);
  }
  // timing: warm runs
  const runs = []; for (let k = 0; k < 5; k++) for (const [id, look] of Object.entries(looks)) for (const ground of [true, false]) { const t0 = performance.now(); paintSitter(look, { seed: id.length * 7919, ground }); runs.push(performance.now() - t0); }
  runs.sort((a, b) => a - b);
  document.getElementById("ms").textContent = `first paint: ${times.map(([i, t]) => `${i} ${t.toFixed(1)} ms`).join(", ")}; warm median ${runs[runs.length >> 1].toFixed(1)} ms, worst ${runs[runs.length - 1].toFixed(1)} ms`;
  window.__ok = true;
</script>
</body>
</html>
