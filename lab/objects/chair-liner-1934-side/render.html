<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>chair-liner-1934-side review viewer</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #1b1b1b; color: #ddd;
               font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #stage { width: 900px; height: 900px; display: block; }
  #hud { position: fixed; left: 908px; top: 8px; width: 360px; white-space: pre-wrap; }
  #hud b { color: #fff; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="stage" width="900" height="900"></canvas>
<div id="hud">booting…</div>

<script type="module">
import * as THREE from 'three';
import { createChairLiner1934Model } from './src/createChairLiner1934Model.js';

const SIZE = 900;
const hud = document.getElementById('hud');
const canvas = document.getElementById('stage');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;

const scene = new THREE.Scene();
scene.background = new THREE.Color().setRGB(128 / 255, 128 / 255, 128 / 255, THREE.SRGBColorSpace);

// Procedural environment: a 2:1 equirectangular gradient built in code (no image, no jsm
// RoomEnvironment), prefiltered so the chrome ferrules have something real to reflect.
function proceduralEnvironment(renderer) {
  const w = 64, h = 32;
  const data = new Float32Array(w * h * 4);
  const sky = new THREE.Color(0.62, 0.64, 0.68);
  const horizon = new THREE.Color(0.50, 0.50, 0.50);
  const floor = new THREE.Color(0.30, 0.30, 0.31);
  const c = new THREE.Color();
  for (let y = 0; y < h; y += 1) {
    const v = y / (h - 1);
    if (v < 0.5) c.copy(sky).lerp(horizon, v / 0.5);
    else c.copy(horizon).lerp(floor, (v - 0.5) / 0.5);
    for (let x = 0; x < w; x += 1) {
      // a soft bright patch upper-left-front, standing in for the reference's key source
      const u = x / (w - 1);
      const boost = Math.max(0, 1 - Math.hypot((u - 0.36) * 2.4, (v - 0.20) * 3.4)) ** 2 * 2.2;
      const i = (y * w + x) * 4;
      data[i] = c.r + boost; data[i + 1] = c.g + boost; data[i + 2] = c.b + boost; data[i + 3] = 1;
    }
  }
  const tex = new THREE.DataTexture(data, w, h, THREE.RGBAFormat, THREE.FloatType);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.needsUpdate = true;
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = pmrem.fromEquirectangular(tex).texture;
  pmrem.dispose();
  tex.dispose();
  return env;
}
scene.environment = proceduralEnvironment(renderer);

// Three-point rig read off the reference (see spec.lightingFromPhoto): soft key high and to
// the camera-left of the subject, cool broad fill from camera-right, low neutral bounce.
const key = new THREE.DirectionalLight(0xfff4e6, 2.1);
key.position.set(-1.5, 2.4, 1.9);
scene.add(key);
const fill = new THREE.DirectionalLight(0xdce4f2, 0.55);
fill.position.set(2.2, 1.0, 1.3);
scene.add(fill);
const bounce = new THREE.DirectionalLight(0xffffff, 0.28);
bounce.position.set(0.3, -1.0, 0.6);
scene.add(bounce);
scene.add(new THREE.AmbientLight(0xffffff, 0.16));

const model = createChairLiner1934Model({ castShadow: false, receiveShadow: false });
scene.add(model);

const box = new THREE.Box3().setFromObject(model);
const size = box.getSize(new THREE.Vector3());
let tris = 0, meshCount = 0;
model.traverse((o) => {
  if (o.isMesh) {
    meshCount += 1;
    const g = o.geometry;
    tris += g.index ? g.index.count / 3 : g.attributes.position.count / 3;
  }
});

const camera = new THREE.PerspectiveCamera(46, 1, 0.01, 100);

function place({ az = -32, dist = 1.28, camY = 0.80, fov = 46, tx = 0, ty = 0.44, tz = -0.02 }) {
  const a = THREE.MathUtils.degToRad(az);
  camera.fov = fov;
  camera.position.set(Math.sin(a) * dist, camY, Math.cos(a) * dist);
  camera.lookAt(tx, ty, tz);
  camera.updateProjectionMatrix();
}

// Every review viewpoint this pass needs. `ref` reproduces the reference photograph's own
// camera; `turn-*` feed the turntable gate; `walk` is the prop's real use — eye height on a
// first-person walk.
const SHOTS = {
  'ref':      { az: -40.6, dist: 1.372, camY: 0.447, fov: 43.1, ty: 0.35, tz: 0 },
  'turn-000': { az: 0,   dist: 1.75, camY: 0.62, fov: 40, ty: 0.44 },
  'turn-090': { az: 90,  dist: 1.75, camY: 0.62, fov: 40, ty: 0.44 },
  'turn-180': { az: 180, dist: 1.75, camY: 0.62, fov: 40, ty: 0.44 },
  'turn-270': { az: 270, dist: 1.75, camY: 0.62, fov: 40, ty: 0.44 },
  'orbit-l':  { az: -70, dist: 1.45, camY: 0.78, fov: 44, ty: 0.44 },
  'orbit-r':  { az: 12,  dist: 1.45, camY: 0.78, fov: 44, ty: 0.44 },
  'high':     { az: -32, dist: 1.60, camY: 1.35, fov: 44, ty: 0.40 },
  'walk':     { az: -32, dist: 2.30, camY: 1.62, fov: 46, ty: 0.42 },
};

function draw(name) {
  place(SHOTS[name] ?? SHOTS.ref);
  renderer.render(scene, camera);
}

async function save2(shot, name) {
  draw(shot);
  const url = canvas.toDataURL('image/png');
  await fetch('/save/' + name + '.png', { method: 'POST', body: url.split(',')[1] });
}

async function save(name) {
  draw(name);
  const url = canvas.toDataURL('image/png');
  await fetch('/save/' + name + '.png', { method: 'POST', body: url.split(',')[1] });
}

const params = new URLSearchParams(location.search);
const only = params.get('view');
// ?fit=az,dist,camY,fov,ty  overrides the reference shot; ?tag=NAME names the saved file.
const fit = params.get('fit');
if (fit) {
  const [az, dist, camY, fov, ty] = fit.split(',').map(Number);
  SHOTS.ref = { az, dist, camY, fov, ty, tz: 0 };
}
const tag = params.get('tag');

// Camera sweep hook: the reference camera is fitted by silhouette search, not guessed, so the
// review loop needs to render arbitrary camera candidates on demand from the console.
window.__shot = async (name, cam) => { SHOTS.__sweep = cam; await save2('__sweep', name); };
window.__view = (cam) => { SHOTS.__sweep = cam; draw('__sweep'); };
window.__stats = () => ({ meshes: meshCount, triangles: Math.round(tris),
  bbox: [size.x, size.y, size.z], minY: box.min.y, maxY: box.max.y,
  textures: renderer.info.memory.textures,
  nodes: Object.keys(model.userData.sculptRuntime?.nodes ?? {}) });

async function run() {
  const lines = [];
  lines.push('<b>chair-liner-1934-side</b>');
  lines.push(`three r${THREE.REVISION}`);
  lines.push(`meshes ${meshCount}   triangles ${Math.round(tris)}`);
  lines.push(`bbox  w ${size.x.toFixed(3)}  h ${size.y.toFixed(3)}  d ${size.z.toFixed(3)}`);
  lines.push(`floor y ${box.min.y.toFixed(4)}  top y ${box.max.y.toFixed(4)}`);
  lines.push(`nodes ${Object.keys(model.userData.sculptRuntime?.nodes ?? {}).length}`);
  lines.push(`textures in GPU: ${renderer.info.memory.textures}`);

  if (tag) {
    await save2('ref', tag);
    lines.push(`saved ${tag}.png`);
  } else if (only) {
    draw(only);
    lines.push(`view: ${only}`);
  } else {
    for (const name of Object.keys(SHOTS)) await save(name);
    draw('ref');
    lines.push(`saved ${Object.keys(SHOTS).length} views to renders/`);
    lines.push(`textures after render: ${renderer.info.memory.textures}`);
  }
  lines.push('CAPTURE-DONE');
  hud.innerHTML = lines.join('\n');
  window.__captureDone = true;
}

run().catch((err) => { hud.textContent = 'ERROR ' + err.message + '\n' + err.stack; });
</script>
</body>
</html>
